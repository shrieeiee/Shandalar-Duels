const STORE='shandalar-duels-v1';
const db={deck:{name:'Red-Green Stompy',cards:{...STARTERS['Red-Green Stompy']}},colors:new Set(),type:'all',q:'',opp:'random',saved:{}};
function loadStore(){ try{ const s=JSON.parse(localStorage.getItem(STORE)||'null'); if(s){ db.saved=s.saved||{}; if(s.current&&s.current.cards) db.deck=s.current; if(s.opp) db.opp=s.opp; } }catch(e){} }
function saveStore(){ try{ localStorage.setItem(STORE,JSON.stringify({saved:db.saved,current:ui.advEdit?db.quick:db.deck,opp:db.opp})); }catch(e){} }
function deckCount(){ return Object.values(db.deck.cards).reduce((a,b)=>a+b,0); }
function deckProblems(){
  const p=[]; const n=deckCount();
  if(n<40) p.push(`Needs at least 40 cards (has ${n}).`);
  for(const [id,k] of Object.entries(db.deck.cards)) if(!DB[id].basic&&k>4) p.push(`${DB[id].name}: at most 4 copies.`);
  return p;
}
function addCard(id,dlt){
  const cur=db.deck.cards[id]||0; let n=cur+dlt;
  if(n>4&&!DB[id].basic){ toast('Four copies at most (basic lands excepted).'); n=4; }
  if(ui.advEdit&&!DB[id].basic&&n>(adv.coll[id]||0)){ toast(`You only own ${adv.coll[id]||0}.`); n=adv.coll[id]||0; }
  if(n<=0) delete db.deck.cards[id]; else db.deck.cards[id]=n;
  saveStore(); renderDeck();
}
const SORTKEY=d=>{ const f=frameOf(d); return ['W','U','B','R','G','M','A','L'].indexOf(f)*100+cmcOf(d); };
function poolCards(){
  return Object.values(DB).filter(d=>{
    if(d.token) return false;
    if(ui.advEdit&&!d.basic&&!(adv.coll[d.id]>0)) return false;
    const f=frameOf(d);
    if(db.colors.size&&!(f==='M'?colorsOfD(d).some(k=>db.colors.has(k)):db.colors.has(f))) return false;
    if(db.type==='creature'&&!isCreatureD(d)) return false;
    if(db.type==='spell'&&(isCreatureD(d)||/Land/.test(d.type))) return false;
    if(db.type==='land'&&!/Land/.test(d.type)) return false;
    if(db.q&&!(d.name+' '+d.text+' '+d.type+' '+(d.sub||'')).toLowerCase().includes(db.q.toLowerCase())) return false;
    return true;
  }).sort((a,b)=>SORTKEY(a)-SORTKEY(b)||a.name.localeCompare(b.name));
}
function renderPoolGrid(){
  const el=$('#poolGrid'); if(!el) return;
  el.innerHTML=poolCards().map(d=>{ const n=db.deck.cards[d.id]||0;
    return `<div class="pc" data-pool="${d.id}" tabindex="0" role="button" aria-label="Add ${esc(d.name)}">${cardFace(d,'','','')}${n?`<span class="cnt">${n}</span><button class="minus" data-minus="${d.id}" aria-label="Remove one">−</button>`:''}</div>`; }).join('')||'<p class="muted">No cards match.</p>';
}
function renderLedger(){
  const el=$('#ledger'); if(!el) return;
  const entries=Object.entries(db.deck.cards).map(([id,n])=>({d:DB[id],n}));
  const grp={Creatures:[],Spells:[],Lands:[]};
  for(const e of entries) grp[/Land/.test(e.d.type)?'Lands':isCreatureD(e.d)?'Creatures':'Spells'].push(e);
  const sum=a=>a.reduce((s,e)=>s+e.n,0);
  const curve=[0,0,0,0,0,0,0]; for(const e of entries) if(!/Land/.test(e.d.type)) curve[Math.min(6,cmcOf(e.d))]+=e.n;
  const mx=Math.max(1,...curve);
  const probs=deckProblems();
  const colorCount={}; for(const e of entries) for(const k of colorsOfD(e.d)) colorCount[k]=(colorCount[k]||0)+e.n;
  const savedNames=Object.keys(db.saved);
  el.innerHTML=`
  <div class="panel" style="display:flex;flex-direction:column;gap:10px">
    <div class="hrow" style="justify-content:space-between"><h2>${esc(db.deck.name)}</h2><span class="muted">${deckCount()} cards</span></div>
    <div class="field"><label for="deckName">Deck name</label><input type="text" id="deckName" value="${esc(db.deck.name)}"></div>
    <div class="hrow">
      <select id="loadDeck" aria-label="Load a deck"><option value="">Load a deck…</option>
        <optgroup label="Starter decks">${Object.keys(STARTERS).map(n=>`<option value="s:${esc(n)}">${esc(n)}</option>`).join('')}</optgroup>
        ${savedNames.length?`<optgroup label="Your saved decks">${savedNames.map(n=>`<option value="u:${esc(n)}">${esc(n)}</option>`).join('')}</optgroup>`:''}
        <optgroup label="Opponent decks">${OPPONENTS.map(o=>`<option value="o:${o.id}">${esc(o.name)}</option>`).join('')}</optgroup>
      </select>
      <button class="btn small ghost" id="saveDeck">Save</button>
      ${db.saved[db.deck.name]?'<button class="btn small ghost" id="delDeck">Delete</button>':''}
      <button class="btn small ghost" id="clearDeck">Clear</button>
    </div>
    <div class="stats"><span>Creatures <b>${sum(grp.Creatures)}</b></span><span>Spells <b>${sum(grp.Spells)}</b></span><span>Lands <b>${sum(grp.Lands)}</b></span><span>${COLORS.filter(k=>colorCount[k]).map(k=>pipHTML(k)+' '+colorCount[k]).join(' ')}</span></div>
    <div style="padding:14px 0 16px"><div class="curve">${curve.map((v,i)=>`<div style="height:${Math.round(v/mx*100)}%"><em>${v||''}</em><span>${i===6?'6+':i}</span></div>`).join('')}</div></div>
    <div class="dl">${Object.entries(grp).map(([k,a])=>a.length?`<div class="grp">${k} · ${sum(a)}</div>`+a.sort((x,y)=>cmcOf(x.d)-cmcOf(y.d)||x.d.name.localeCompare(y.d.name)).map(e=>`<div class="dline"><span class="n">${e.n}</span><span class="nm" data-prev="${e.d.id}">${esc(e.d.name)}</span><span class="cost" style="display:flex;gap:1px">${costHTML(e.d.cost)}</span><span style="display:flex;gap:3px"><button data-dl="${e.d.id}" data-d="-1" aria-label="Remove one">−</button><button data-dl="${e.d.id}" data-d="1" aria-label="Add one">+</button></span></div>`).join(''):'').join('')||'<span class="muted">Click cards on the left to add them.</span>'}</div>
    <div class="valid-msg ${probs.length?'bad':'good'}">${probs.length?probs.map(esc).join('<br>'):'Deck is legal for a duel.'}</div>
  </div>
  <div class="panel" style="display:flex;flex-direction:column;gap:10px">
    ${ui.advEdit?'':`<div class="field"><label for="oppSel">Opponent</label>
      <select id="oppSel"><option value="random" ${db.opp==='random'?'selected':''}>Random opponent</option>${OPPONENTS.map(o=>`<option value="${o.id}" ${db.opp===o.id?'selected':''}>${esc(o.name)} — ${CNAME[o.color]}</option>`).join('')}</select></div>`}
    ${ui.advEdit?'<p class="muted">Adventure deck — you can only use cards you own. Basic lands are free.</p><button class="btn" id="advBack">Back to the map</button>':`<label class="muted"><input type="checkbox" id="optAnte" ${db.ante?'checked':''}> Play for ante (winner takes the loser's ante card; sandbox only)</label><button class="btn" id="startDuel" ${probs.length?'disabled':''}>Start duel</button>`}
    ${g&&!g.over&&!ui.advEdit?'<button class="btn ghost" id="resumeDuel">Return to current duel</button>':''}
  </div>
  <div class="panel rules"><h3>Duel rules</h3><ul>
    <li>20 life, 7-card opening hand; mulligan down by one card each time.</li>
    <li>Coin toss decides who plays first; that player skips their first draw.</li>
    <li>Decks need 40+ cards, at most 4 copies of any non-basic card.</li>
    <li>Interrupts and instants use the stack; spells fizzle if their target is gone.</li>
    <li>Unused mana in your pool at the end of a step causes mana burn.</li>
    <li>First strike, trample, protection, landwalk, regeneration and walls work as in the 1997 game.</li>
  </ul></div>`;
}
function renderDeck(){
  if(HEADLESS) return;
  if(!$('#poolGrid')){
    $('#deckView').innerHTML=`<div style="min-width:0">
      <div class="filters" role="toolbar" aria-label="Card filters">
        ${[...COLORS,'A','L'].map(k=>`<button class="cf" data-cf="${k}" aria-pressed="${db.colors.has(k)}">${k==='A'?'<span class="pip p-N">◇</span> Artifact':k==='L'?'<span class="pip p-N">L</span> Land':pipHTML(k)+' '+CNAME[k]}</button>`).join('')}
        <select id="typeSel" aria-label="Card type"><option value="all">All types</option><option value="creature">Creatures</option><option value="spell">Non-creature spells</option><option value="land">Lands</option></select>
        <input type="text" id="search" placeholder="Search name or text" aria-label="Search cards">
      </div>
      <div class="pool-grid" id="poolGrid"></div>
    </div>
    <aside class="ledger" id="ledger"></aside>`;
  }
  document.querySelectorAll('[data-cf]').forEach(b=>b.setAttribute('aria-pressed',db.colors.has(b.dataset.cf)));
  renderPoolGrid(); renderLedger();
}
function startDuelFromBuilder(){
  if(deckProblems().length){ toast('Fix the deck before starting.'); return; }
  const opp=db.opp==='random'?OPPONENTS[Math.floor(Math.random()*OPPONENTS.length)]:OPPONENTS.find(o=>o.id===db.opp);
  ui.lastOpp=opp; closeModal();
  setView('duel');
  const names=['You',opp.name]; names.meta=opp; names.ante=!!db.ante;

  const w=src.width,h=src.height; const out=mkCv(w,h); const o=out.getContext('2d'); const sd=src.getContext('2d').getImageData(0,0,w,h).data;
  const op=(x,y)=>x>=0&&y>=0&&x<w&&y<h&&sd[(y*w+x)*4+3]>40;
  o.fillStyle=col;
  for(let y=0;y<h;y++) for(let x=0;x<w;x++) if(!op(x,y)&&(op(x-1,y)||op(x+1,y)||op(x,y-1)||op(x,y+1))) o.fillRect(x,y,1,1);
  o.drawImage(src,0,0); return out;
}
// scanline disc / triangle helpers (crisp pixels)
function disc(x,cx,cy,r,col){ x.fillStyle=col; for(let y=-r;y<=r;y++){ const w=Math.floor(Math.sqrt(r*r-y*y)+.35); x.fillRect(cx-w,cy+y,w*2+1,1); } }
function tri(x,cx,top,h,hw,col){ x.fillStyle=col; for(let i=0;i<h;i++){ const w=Math.max(0,Math.round(hw*(i+1)/h)); x.fillRect(cx-w,top+i,w*2+1,1); } }

K.fam={ grass:(r,g,b)=>g>r+12&&g>=b+12, dirt:(r,g,b)=>r>g+14&&g>b+14&&r>170, roof:(r,g,b)=>r>g+50&&r>b+50, purple:(r,g,b)=>r>g+25&&b>g+25, orange:(r,g,b)=>r>g+30&&g>b+40&&r>190 };
K.lum=(r,g,b)=>r*.3+g*.59+b*.11;
K.refOf=(cv,fam)=>{ const d=cv.getContext('2d').getImageData(0,0,cv.width,cv.height).data; let n=0,s=0; for(let i=0;i<d.length;i+=4) if(d[i+3]>200&&K.fam[fam](d[i],d[i+1],d[i+2])){ s+=K.lum(d[i],d[i+1],d[i+2]); n++; } return n?s/n:128; };

  const rnd=mulberry(hash32(tw.id)+adv.stock*7919); const col=tw.id==='H'?null:tw.id; const pool=advPool();
  const pref=pool.filter(d=>col?colorsOfD(d).includes(col)||(colorsOfD(d).length===0):true);
  const a=advSample(rnd,pref,5), b=advSample(rnd,pool,3);
  let ids=[...new Set([...a,...b].map(d=>d.id))].slice(0,7);
  if(advNight()>.5){ const rare=advSample(rnd,pool.filter(d=>cmcOf(d)>=4),3).map(d=>d.id); ids=[...new Set([...rare,...ids])].slice(0,8); }
  return ids;
}
const advPrice=d=>Math.round(cardValue(d)*(advNight()>.5?1.4:1.2)/5)*5;
const advSell=d=>Math.max(5,Math.round(cardValue(d)*.45/5)*5);
function shopHTML(kind,tw){
  const head=`<img class="intart sm" alt="" src="${interiorImg('shop',tw.id)}"><h2>${kind==='buy'?tw.name+' — card stall':'Sell cards'}</h2><p class="muted">Gold: <b>${adv.gold}</b></p>`;
  let items;
  if(kind==='buy') items=stockFor(tw).map(id=>({id,price:advPrice(DB[id]),act:'buy',own:adv.coll[id]||0}));
  else items=Object.entries(adv.coll).filter(([id,n])=>n>0&&DB[id]).map(([id,n])=>({id,price:advSell(DB[id]),act:'sell',own:n,used:adv.deck.cards[id]||0})).sort((a,b)=>b.price-a.price);
  if(!items.length) return head+'<p>Nothing here.</p><button class="btn ghost" data-close>Close</button>';
  return head+`<div class="mgrid shop">${items.map(i=>`<div class="shopc">${cardFace(DB[i.id],'','hc',`data-adv="${i.act}" data-id="${i.id}" tabindex="0"`)}<div class="pr">${i.act==='buy'?'Buy':'Sell'} ${i.price}g · own ${i.own}${i.used?` (${i.used} in deck)`:''}</div></div>`).join('')}</div><button class="btn ghost" data-close>Done</button>`;
}
function openShop(kind,tw){ return new Promise(res=>{ ui.shop={kind,tw}; openModal(shopHTML(kind,tw)); ui.onModalClose=res; }); }
function reshop(){ const m=document.querySelector('#modal .mbox'); const st=m?m.scrollTop:0; const {kind,tw}=ui.shop; const cb=ui.onModalClose; openModal(shopHTML(kind,tw)); ui.onModalClose=cb; const m2=document.querySelector('#modal .mbox'); if(m2) m2.scrollTop=st; }
async function advTown(tw){
  await interiorSplash('shop',tw.id,tw.id==='H'?'Dar Market':tw.name,advNight()>.5?'The night market':'Card stalls and curiosities');
  await say(tw.id==='H'?'Welcome to Dar, the crossroads of Shandalar!':`Welcome to ${tw.name}!`);
  if(advNight()>.5) await say('The lamps are lit — the night market is open. Rarer wares, but at a premium.');
  for(;;){
    const c=await ask('What would you like to do?',['Buy cards','Sell cards','Booster pack — 120g','Save game','Leave town']);
    if(c===0) await openShop('buy',tw);
    else if(c===1) await openShop('sell',tw);
    else if(c===2){ if(adv.gold<120){ await say('You cannot afford a pack.'); continue; } adv.gold-=120; const ids=advBooster(tw); ids.forEach(id=>adv.coll[id]=(adv.coll[id]||0)+1); advSave(); await new Promise(res=>{ openModal(`<h2>Booster pack</h2><div class="mgrid">${ids.map(id=>cardFace(DB[id],'','hc','')).join('')}</div><button class="btn" data-close>Take them</button>`); ui.onModalClose=res; }); }
    else if(c===3){ advSave(); await say('Game saved.'); }
    else break;
  }
}
function advBooster(tw){ const pool=advPool(); const col=tw.id==='H'?null:tw.id; const pref=pool.filter(d=>!col||colorsOfD(d).includes(col)); const out=[...advSample(Math.random,pref,3),...advSample(Math.random,pool,2),...advSample(Math.random,pool.filter(d=>cmcOf(d)>=4),1)]; return out.map(d=>d.id); }

async function advMenu(){
  if(ADV.mode!=='map'||ADV.mv) return; ADV.mode='busy';
  for(;;){
    const c=await ask(`Gold ${adv.gold} · Wizards ${advWizards()}/5 · Wins ${adv.wins} · Slot ${advSlot()}`,['Edit deck','Collection','Save game','Export / import saves','Title screen',`Sound: ${SND.on?'on':'off'}`,`Graphics: ${({0:'high',1:'medium',2:'classic'})[advQual()]}${pget('shd-q','auto')==='auto'?' (auto)':''}`,'Accessibility',...(HAS_NATIVE?['Card art']:[]),'Close'],'Menu');

    if(c===1){ await new Promise(res=>{ const es=Object.entries(adv.coll).filter(([i,n])=>n>0).map(([i,n])=>[DB[i],n]).sort((a,b)=>SORTKEY(a[0])-SORTKEY(b[0])); openModal(`<h2>Your collection (${es.reduce((s,e)=>s+e[1],0)} cards)</h2><div class="mgrid shop">${es.map(([d,n])=>`<div class="shopc">${cardFace(d,'','hc','')}<div class="pr">×${n}</div></div>`).join('')}</div><button class="btn ghost" data-close>Close</button>`); ui.onModalClose=res; }); }
    else if(c===2){ advSave(); await say('Game saved.'); }
    else if(c===3){ advSave(); await new Promise(res=>{ ui.savesBack=res; advSavesModal(); }); }
    else if(c===4){ advSave(); ADV.mode='idle'; advTitle(); return; }
    else if(c===5){ sndGesture(); sndSet(!SND.on); }

const TINTS={H:[255,236,190,.12],W:[255,238,196,.16],U:[110,200,255,.15],B:[60,70,130,.34],R:[255,110,40,.2],G:[70,170,90,.13]};
function maskFor(tt,x,y){
  const n=tileAt(x,y-1), e=tileAt(x+1,y), s=tileAt(x,y+1), w=tileAt(x-1,y);
  const wallish=q=>q===T.WALL||q===T.DOOR||q===T.TWALL||q===T.TDOOR;
  if(tt===T.WATER) return (n!==3?1:0)|(e!==3?2:0)|(s!==3?4:0)|(w!==3?8:0);
  if(tt===T.PATH){ const np=q=>q!==T.PATH&&!BUILD.has(q)&&q!==T.CAVE; return (np(n)?1:0)|(np(e)?2:0)|(np(s)?4:0)|(np(w)?8:0); }
  if(tt===T.ROOF) return (n===T.ROOF?1:0)|(w===T.ROOF?2:0)|(e===T.ROOF?4:0);
  if(tt===T.WALL) return ((w===T.WALL||w===T.DOOR)?2:0)|((e===T.WALL||e===T.DOOR)?4:0);
  if(tt===T.TTOP||tt===T.TPEAK) return (w===tt?2:0)|(e===tt?4:0);
  if(tt===T.G||tt===T.TALL||tt===T.TREE||tt===T.ROCK||tt===T.CAVE) return (wallish(n)?1:0)|(n===3?2:0)|(e===3?4:0)|(s===3?8:0)|(w===3?16:0);
  return 0;
}
function cloudTex(){
