<title>Shandalar Duels</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;0,800;1,400&family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap">
<style>
/* Layout: two views — a deck-building workbench (pool grid + deck ledger) and a duel table (board column + rail with preview, stack, log). Single dark "candlelit table" look by choice. */
:root{
  --felt:#16212a; --felt-hi:#213242; --rail:#10181f; --line:#2c3b47;
  --brass:#c9a24a; --brass-dim:#8a6d2c; --ink:#ebe4d2; --muted:#98a4ab;
  --blood:#d0563b; --moss:#74b06c; --glow:#f2cc5c;
  --display:"IM Fell English SC","Palatino Linotype",Palatino,Georgia,serif;
  --body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  --ui:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --head:"Sora","Inter",system-ui,sans-serif; --acc:#f2cc5c;
  --bw:76px; --bh:104px; --hw:100px; --hh:140px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:radial-gradient(ellipse at 50% 35%,var(--felt-hi) 0%,var(--felt) 55%,#0f161c 100%) fixed var(--felt);color:var(--ink);font:15px/1.4 var(--body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
#app{min-height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar{display:flex;align-items:center;gap:16px;padding-block:10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font:800 24px/1 var(--head);color:var(--brass);letter-spacing:-.01em}
.brand small{display:block;font:500 11px/1.3 var(--body);color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
.tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
@media(max-width:560px){.tab{padding:6px 8px;font-size:11px}}
.tab{background:none;border:1px solid transparent;border-radius:4px;padding:6px 12px;color:var(--muted);cursor:pointer;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:12px}
.tab[aria-current="true"]{color:var(--ink);border-color:var(--brass-dim);background:#1b2833}
.btn{background:var(--brass);color:#1d160a;border:none;border-radius:4px;padding:8px 14px;font-weight:800;cursor:pointer;font-size:13px;letter-spacing:.02em}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--brass-dim)}
.btn.warn{background:var(--blood);color:#fff}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.btn.small{padding:4px 9px;font-size:12px}
select,input[type=text]{background:#0f171e;color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:6px 8px;font:inherit;font-size:13px}

/* ---------- cards ---------- */
.f-W{--fb:#eee6cf;--fe:#b39f6c;--ft:#2a2418}
.f-U{--fb:#d0e0f1;--fe:#3a6ba3;--ft:#14212f}
.f-B{--fb:#cfc8cc;--fe:#3a3135;--ft:#1b1719}
.f-R{--fb:#f1cfbc;--fe:#ab472b;--ft:#2b140c}
.f-G{--fb:#d1e2c2;--fe:#3c7843;--ft:#13240f}
.f-A{--fb:#ddd7ce;--fe:#857a6e;--ft:#221e1a}
.f-M{--fb:#f0e2a8;--fe:#a8863a;--ft:#2a2010}
.f-L{--fb:#e4d8bc;--fe:#7a6646;--ft:#241c10}
.card{position:relative;background:var(--fb);color:var(--ft);border:2px solid var(--fe);border-radius:7px;display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none;box-shadow:0 2px 6px #0008}
.card .hd{display:flex;align-items:flex-start;gap:3px;padding:3px 4px 2px;background:color-mix(in srgb,var(--fe) 20%,var(--fb));border-bottom:1px solid color-mix(in srgb,var(--fe) 45%,var(--fb))}
.card .nm{flex:1;min-width:0;font:12px/1.05 var(--display);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card .cost{display:flex;gap:1px;flex-shrink:0}
.card .ty{font-size:9.5px;font-weight:700;padding:2px 4px;border-bottom:1px solid color-mix(in srgb,var(--fe) 30%,var(--fb));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .tx{font-size:10px;line-height:1.2;padding:3px 4px;flex:1;overflow:hidden}
.card .art{flex:0 0 28%;min-height:26px;overflow:hidden;line-height:0;border-bottom:1px solid color-mix(in srgb,var(--fe) 45%,var(--fb))}
.card .art svg{width:100%;height:100%;display:block}
.card .pt{position:absolute;right:3px;bottom:3px;background:var(--fb);border:1.5px solid var(--fe);border-radius:4px;font:800 12px/1 var(--body);padding:2px 4px;font-variant-numeric:tabular-nums}
.pt .up{color:#1f7a2a}.pt .dn{color:#b02d17}
.pip{display:inline-grid;place-items:center;width:14px;height:14px;border-radius:50%;font:800 9px/1 var(--body);flex-shrink:0;vertical-align:-2px}
.p-W{background:#f8f1d8;color:#5b4d24;box-shadow:inset 0 0 0 1px #b9a774}
.p-U{background:#3a78c2;color:#fff}
.p-B{background:#2e2629;color:#e5dde0;box-shadow:inset 0 0 0 1px #6b5e63}
.p-R{background:#cf4a2c;color:#fff}
.p-G{background:#3f8a49;color:#fff}
.p-N{background:#bdb6ac;color:#2a2622}
.p-T{background:#6c6157;color:#fff}

.bc{width:var(--bw);height:var(--bh);cursor:pointer;transition:transform .18s,box-shadow .18s}
.bc .tx,.bc .art{display:none}
.bc .ty{font-size:8.5px}
.hc{width:var(--hw);height:var(--hh);flex-shrink:0;cursor:pointer;transition:transform .15s,box-shadow .15s}
.hc:hover{transform:translateY(-6px)}
.hc .tx{font-size:9.5px}
.card.playable{box-shadow:0 0 0 2px var(--moss),0 4px 10px #0009}
.card.valid{box-shadow:0 0 0 3px var(--glow),0 0 16px var(--glow);cursor:crosshair}
.card.sel{box-shadow:0 0 0 3px var(--brass),0 0 12px var(--brass)}
.card.atk{box-shadow:0 0 0 3px var(--blood),0 0 14px var(--blood)}
.card.blk{box-shadow:0 0 0 3px #6aa6e8,0 0 12px #6aa6e8}
.card.disc{box-shadow:0 0 0 3px var(--blood)}
.badges{position:absolute;left:3px;bottom:3px;display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.badge{font:800 9px/1 var(--body);padding:2px 3px;border-radius:3px;background:#1d1611;color:#f3e6c6;white-space:nowrap}
.badge.dmg{background:var(--blood);color:#fff}
.badge.sick{background:#4b5560}
.slot{display:flex;flex-direction:column;align-items:center;gap:3px;width:var(--bw);flex-shrink:0;transition:transform .18s}
.slot.tap{width:var(--bh)}
.slot.tap .bc{transform:rotate(90deg) translateX(calc((var(--bh) - var(--bw))/-2 + 0px));margin-block:calc((var(--bw) - var(--bh))/2)}
.slot.atk-me{transform:translateY(-12px)}
.slot.atk-opp{transform:translateY(12px)}
.chips{display:flex;flex-direction:column;gap:2px;width:100%}
.chip{font:700 9.5px/1.15 var(--body);background:#22313d;border:1px solid var(--line);border-radius:3px;padding:2px 4px;cursor:pointer;color:var(--ink);text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.valid{border-color:var(--glow);box-shadow:0 0 8px var(--glow)}
.blocknote{font:700 9.5px/1.1 var(--body);color:#9cc6f2;text-align:center;max-width:var(--bh)}

/* ---------- duel table ---------- */
.table{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:16px;padding-block:12px}
.board{display:flex;flex-direction:column;gap:8px;min-width:0}
.pbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.who{display:flex;align-items:center;gap:10px;padding:5px 12px 5px 6px;border-radius:30px;background:#0f171ecc;border:1px solid var(--line);cursor:default}
.who.valid{border-color:var(--glow);box-shadow:0 0 14px var(--glow);cursor:crosshair}
.life{font:30px/1 var(--display);min-width:40px;text-align:center;color:var(--ink);font-variant-numeric:tabular-nums}
.life.low{color:var(--blood)}
.pname{font:700 13px/1.1 var(--body)}
.pname small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.zinfo{display:flex;gap:10px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.zinfo b{color:var(--ink);font-variant-numeric:tabular-nums}
.zbtn{background:none;border:1px solid var(--line);border-radius:4px;padding:3px 7px;color:var(--muted);cursor:pointer;font-size:12px}
.zbtn:hover{color:var(--ink);border-color:var(--brass-dim)}
.pool{display:flex;gap:2px;align-items:center}
.row{display:flex;gap:8px;align-items:flex-end;min-height:calc(var(--bh) + 18px);padding:8px;overflow-x:auto;border-radius:8px;background:#0b12182e;border:1px dashed #2a3945}
.row.opp{align-items:flex-start}
.row.lands{min-height:0;padding:6px 8px;gap:6px;align-items:center;flex-wrap:wrap;overflow:visible}
.row .empty{color:#55636d;font-size:12px;font-style:italic;align-self:center}
.landg{display:flex;align-items:center;gap:6px;padding:4px 8px 4px 4px;border-radius:6px;border:1.5px solid var(--fe);background:var(--fb);color:var(--ft);cursor:pointer;font-weight:700;font-size:12px}
.landg .dots{display:flex;gap:2px}
.landg .dot{width:8px;height:12px;border-radius:2px;background:var(--fe)}
.landg .dot.t{background:transparent;box-shadow:inset 0 0 0 1.5px var(--fe);opacity:.6}
.landg.valid{box-shadow:0 0 0 3px var(--glow),0 0 14px var(--glow)}
.landg.dim{opacity:.55}
.mid{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 10px;border-radius:8px;background:#0e161dd9;border:1px solid var(--line)}
.phases{display:flex;gap:2px;flex-wrap:wrap;max-width:260px}
.ph{font:800 9.5px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;padding:4px 5px;border-radius:3px;color:#5f6d77;background:#16212a}
.ph.on{background:var(--brass);color:#1d160a}
.ph.on.opp{background:var(--blood);color:#fff}
.prompt{font-size:14px;min-width:0}
.prompt .turn{font:700 11px/1.2 var(--body);color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.hand{display:flex;gap:8px;overflow-x:auto;padding:10px 4px 6px;min-height:calc(var(--hh) + 18px)}
.rail{display:flex;flex-direction:column;gap:12px;min-width:0}
.panel{background:var(--rail);border:1px solid var(--line);border-radius:8px;padding:10px}
.panel h3{margin:0 0 6px;font:11px/1 var(--body);font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.big{width:100%;max-width:250px;aspect-ratio:5/7;margin-inline:auto}
.big .nm{font-size:17px}
.big .ty{font-size:12px}
.big .tx{font-size:13px;line-height:1.35;padding:8px}
.big .art{flex-basis:36%}
.big .pt{font-size:16px;padding:3px 7px}
.big .pip{width:17px;height:17px;font-size:10.5px}
.stack{display:flex;flex-direction:column-reverse;gap:4px;min-height:24px}
.sitem{font-size:13px;padding:5px 8px;border-radius:4px;background:#1a2631;border-left:3px solid var(--brass);cursor:pointer}
.sitem.opp{border-left-color:var(--blood)}
.sitem.valid{box-shadow:0 0 0 2px var(--glow)}
.log{max-height:260px;overflow-y:auto;font-size:12.5px;display:flex;flex-direction:column;gap:2px}
.log .t{color:var(--brass);font-weight:800;margin-top:6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.log .o{color:#e7a08e}
.log .m{color:#cfe0c3}
.muted{color:var(--muted)}
.opts{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.opts label{display:flex;gap:5px;align-items:center;cursor:pointer}

/* ---------- deck builder ---------- */
.builder{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;padding-block:14px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.cf{border:1px solid var(--line);background:#0f171e;border-radius:20px;padding:3px 8px 3px 4px;display:flex;align-items:center;gap:5px;cursor:pointer;font-size:12px;font-weight:700;color:var(--muted)}
.cf[aria-pressed="true"]{border-color:var(--brass);color:var(--ink);background:#1d2a35}
.pool-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:12px}
.pc{position:relative;cursor:pointer}
.pc .card{width:100%;aspect-ratio:5/7}
.pc .card .tx{font-size:9.5px}
.pc .cnt{position:absolute;top:-6px;right:-6px;background:var(--brass);color:#1d160a;border-radius:12px;font:800 12px/1 var(--body);padding:4px 7px;box-shadow:0 2px 4px #000a}
.pc .minus{position:absolute;top:-6px;left:-6px;width:22px;height:22px;border-radius:50%;border:none;background:#2a3540;color:var(--ink);font-weight:800;cursor:pointer;line-height:1}
.ledger{display:flex;flex-direction:column;gap:12px;align-self:start;position:sticky;top:12px}
.ledger h2{margin:0;font:22px/1.1 var(--display);color:var(--brass)}
.dl{display:flex;flex-direction:column;gap:1px;max-height:340px;overflow-y:auto}
.dl .grp{font:800 10.5px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:8px 0 3px}
.dline{display:grid;grid-template-columns:22px minmax(0,1fr) auto auto;gap:6px;align-items:center;font-size:13px;padding:2px 4px;border-radius:3px}
.dline:hover{background:#1a2631}
.dline .n{font-weight:800;font-variant-numeric:tabular-nums;color:var(--brass)}
.dline .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:default}
.dline button{background:none;border:1px solid var(--line);border-radius:3px;width:22px;height:20px;cursor:pointer;color:var(--ink);padding:0}
.curve{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;align-items:end;height:64px}
.curve div{background:var(--brass-dim);border-radius:2px 2px 0 0;position:relative;min-height:2px}
.curve span{position:absolute;bottom:-16px;left:0;right:0;text-align:center;font-size:10px;color:var(--muted)}
.curve em{position:absolute;top:-14px;left:0;right:0;text-align:center;font-size:10px;font-style:normal;color:var(--ink)}
.stats{display:flex;gap:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.stats b{color:var(--ink)}
.valid-msg{font-size:12.5px}
.valid-msg.bad{color:#f0957f}.valid-msg.good{color:var(--moss)}
.rules{font-size:12.5px;color:var(--muted)}
.rules ul{margin:4px 0 0;padding-left:16px}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.hrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* ---------- modal & toast ---------- */
.modal{position:fixed;inset:0;background:#05090ccc;display:grid;place-items:center;z-index:50;padding:16px}
.mbox{background:var(--rail);border:1px solid var(--brass-dim);border-radius:10px;padding:18px;max-width:min(560px,100%);width:100%;max-height:86vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.mbox h2{margin:0;font:24px/1.1 var(--display);color:var(--brass);text-wrap:balance}
.mgrid{display:flex;flex-wrap:wrap;gap:8px}
.xrow{display:flex;align-items:center;gap:12px}
.xval{font:40px/1 var(--display);min-width:54px;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#2b1d14;border:1px solid var(--brass-dim);color:var(--ink);padding:8px 14px;border-radius:6px;font-size:13px;z-index:60;pointer-events:none;opacity:0;transition:opacity .2s}
.toast.on{opacity:1}

@media (max-width:900px){
  .table,.builder{grid-template-columns:minmax(0,1fr)}
  .ledger{position:static}
  .rail .prev-panel{display:none}
}
@media (max-width:560px){
  :root{--bw:60px;--bh:84px;--hw:86px;--hh:122px}
  .bc .ty{display:none}
  .bc .nm{font-size:10.5px}
  .mid{grid-template-columns:minmax(0,1fr)}
  .acts{justify-content:flex-start}
  .phases{max-width:none}
  .life{font-size:24px;min-width:30px}
  .pool-grid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}
}
.adv{display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px 12px 24px}
.advwrap{position:relative;width:min(100%,968px);background:#05040c;border:4px solid #1a1530;border-radius:6px;overflow:hidden;box-shadow:0 0 0 2px #0b0818,0 0 0 4px var(--brass-dim),0 14px 36px rgba(0,0,0,.55);touch-action:none}
#advCanvas{width:100%;height:auto;aspect-ratio:15/11;display:block;cursor:pointer}
.advwrap[data-reg=W]{--acc:#f2d98a}.advwrap[data-reg=U]{--acc:#6ab4ff}.advwrap[data-reg=B]{--acc:#c49af0}.advwrap[data-reg=R]{--acc:#ff8a54}.advwrap[data-reg=G]{--acc:#7ed68a}.advwrap[data-reg=H]{--acc:#f2cc5c}
.glass{background:rgba(10,14,26,.66);-webkit-backdrop-filter:blur(12px) saturate(1.35);backdrop-filter:blur(12px) saturate(1.35);border:1px solid rgba(255,255,255,.15);box-shadow:0 8px 26px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.09)}
.dlg{position:absolute;left:3%;right:3%;bottom:3.5%;padding:18px 22px 15px;border-radius:18px;color:#f1f4fb;font:500 clamp(13px,1.9vw,17px)/1.55 var(--ui);min-height:5.2em;z-index:2;background:rgba(9,13,25,.8);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);border:1px solid rgba(255,255,255,.17);box-shadow:0 12px 34px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.1);animation:dlgin .18s ease-out}
@keyframes dlgin{from{opacity:0;transform:translateY(8px)}}
.dlg .who{position:absolute;top:-13px;left:20px;background:var(--acc);color:#10131c;padding:3px 13px;border-radius:999px;font:700 11px var(--ui);letter-spacing:.09em;text-transform:uppercase;box-shadow:0 3px 10px rgba(0,0,0,.4)}
.dlg .tx{min-height:3.2em;letter-spacing:.005em;text-wrap:pretty}
.dlg .more{position:absolute;right:20px;bottom:10px;color:var(--acc);font-size:12px;display:flex;gap:7px;align-items:center;opacity:.9;animation:bob 1s ease-in-out infinite}
.dlg .more kbd{font:600 10px var(--ui);border:1px solid rgba(255,255,255,.3);border-radius:5px;padding:1px 6px;color:#cfd6e6;background:rgba(255,255,255,.07)}
@keyframes bob{50%{transform:translateY(3px)}}
.dlg .opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.dlg .opts button{background:rgba(255,255,255,.08);color:#eef2fb;border:1px solid rgba(255,255,255,.2);border-radius:999px;font:600 clamp(12px,1.6vw,15px) var(--ui);padding:7px 16px;cursor:pointer;transition:background .12s,transform .12s,color .12s}
.dlg .opts button:hover{background:rgba(255,255,255,.17)}
.dlg .opts button.on{background:var(--acc);color:#10131c;border-color:transparent;transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,0,0,.35)}
.advhud{position:absolute;top:10px;left:10px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;z-index:2;pointer-events:none}
.advhud .chip{display:inline-flex;align-items:center;gap:7px;font:600 clamp(11px,1.5vw,13px) var(--ui);color:#f1f4fb;background:rgba(9,13,25,.66);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:5px 12px 5px 8px;box-shadow:0 4px 14px rgba(0,0,0,.35);cursor:default;white-space:nowrap}
.advhud .chip svg{width:16px;height:16px;flex:none}
.advhud .chip b{font-weight:700;color:var(--acc)}
.advhud .pips{display:inline-flex;gap:4px;margin-left:2px}.advhud .pips i{width:9px;height:9px;border-radius:50%;border:1.5px solid rgba(255,255,255,.4);background:transparent}.advhud .pips i.on{border-color:transparent;box-shadow:0 0 8px currentColor;background:currentColor}
.advmini{position:absolute;top:10px;right:10px;z-index:2;display:flex;flex-direction:column;gap:6px;align-items:flex-end}

body{font-family:var(--ui);font-size:14px}

.row{border-radius:14px;background:rgba(8,12,18,.35);border:1px solid rgba(255,255,255,.07)}

.ledger h2,.mbox h2{font:700 20px/1.15 var(--head);letter-spacing:-.01em;color:var(--acc)}
.dline{border-radius:8px;font-family:var(--ui)}

.mbox{border-radius:20px}
.svtabs{display:flex;gap:8px;margin:10px 0}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid #fff;outline-offset:2px;box-shadow:0 0 0 5px #000}
/* accessibility: reduced motion + colour-blind-safe pips */
body.rm *,body.rm *::before,body.rm *::after{animation:none!important;transition:none!important}
body.rm .hc:hover,body.rm .pc:hover .card{transform:none}
.pip{position:relative}

.netbn{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:60;background:#3a1d14;border:1px solid #c9663f;color:#ffd9c9;border-radius:999px;padding:8px 18px;font:600 13px var(--ui);box-shadow:0 6px 20px rgba(0,0,0,.4);max-width:calc(100vw - 24px);text-align:center}

.intwrap{position:relative}.intart{display:block;width:100%;image-rendering:pixelated;border-radius:14px;border:1px solid rgba(255,255,255,.14);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.intart.sm{max-height:110px;object-fit:cover;margin-bottom:8px}

.intcap b{font:700 18px var(--head);color:var(--acc)}.intcap span{font:500 12.5px var(--ui);color:#d8deec}
/* ===== v37 duel readability redesign ===== */
:root{--bw:108px;--bh:150px;--hw:118px;--hh:170px}
/* mana symbols: big, ringed, high contrast */
#duelView .pip,#modal .pip{width:22px;height:22px;font:800 13px/1 var(--head);vertical-align:middle;text-shadow:0 1px 1px rgba(0,0,0,.35)}
body:not(.cb) #duelView .pip,body:not(.cb) #modal .pip{box-shadow:0 0 0 1.5px rgba(10,12,16,.7),inset 0 -2px 3px rgba(0,0,0,.28),inset 0 1px 2px rgba(255,255,255,.4)}
#duelView .p-W,#modal .p-W{background:#fbf3cf;color:#4a3d12;text-shadow:none}
#duelView .p-N,#modal .p-N{background:#d5cfc4;color:#15110d;text-shadow:none;font-size:14px}
#duelView .p-B,#modal .p-B{background:#3a2f35;color:#fff;box-shadow:0 0 0 1.5px #c9bfc4}
#duelView .p-T,#modal .p-T{background:#5d544b;font-size:14px}
body.cb #duelView .pip,body.cb #modal .pip{font-size:13px}
#duelView .cost,#modal .cost{gap:3px}
#duelView .tx .pip,#modal .tx .pip{width:17px;height:17px;font-size:11px;vertical-align:-3px;margin:0 1px}
#duelView .hd,#modal .hc .hd{padding:4px 5px 3px}
#duelView .big .pip{width:26px;height:26px;font-size:15px}
#duelView .big .cost{gap:4px}
#duelView .pool .pip{width:24px;height:24px}
#duelView .sitem .pip{width:18px;height:18px;font-size:11px}
/* hand cards: name on top, cost on its own line */
.hc .hd,.hc.card .hd{flex-wrap:wrap}
.hc .nm{flex:1 1 100%;font-size:13px}
.hc .cost{flex:1 1 100%;justify-content:flex-end;min-height:0}
.hc .cost:empty{display:none}
.hc .tx{font-size:10.5px}
.hc .ty{font-size:10px}
/* battlefield cards */
.bc{width:var(--bw);height:var(--bh)}
.bc .art{display:none}
.bc .artw{position:relative;flex:1 1 auto;min-height:0;display:flex;border-bottom:1px solid color-mix(in srgb,var(--fe) 45%,var(--fb))}
.bc .artw .art{display:block;flex:1;border:0;min-height:0;flex-basis:auto}
.bc .nm{font-size:13px;line-height:1.08;-webkit-line-clamp:2}
.bc .ty{font-size:9.5px;font-weight:700;display:block}
.bc .kws{display:flex;flex-wrap:wrap;gap:2px;padding:2px 3px 3px}
.bc .kw{font:800 9px/1 var(--ui);padding:2px 4px;border-radius:999px;background:color-mix(in srgb,var(--fe) 75%,#000);color:#fff;white-space:nowrap}
.bc .pt{right:0;bottom:0;border-radius:10px 0 0 0;border-width:0;border-top:2px solid var(--fe);border-left:2px solid var(--fe);font:800 22px/1 var(--head);padding:3px 8px 3px 9px;background:#14100c;color:#fff;letter-spacing:-.02em}
.bc .pt i{font-style:normal;opacity:.55;margin:0 1px;font-weight:600}
.bc .pt .up{color:#7fe08a}.bc .pt .dn{color:#ff8c7a}
.bc .badges{left:3px;bottom:30px;z-index:2}
.bc .badge{font:800 10px/1 var(--ui);padding:3px 5px;border-radius:6px}
.bc .fls{position:absolute;left:0;top:0;right:0;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:3px}
.fl{font:800 9.5px/1 var(--ui);letter-spacing:.06em;text-transform:uppercase;padding:3px 6px;border-radius:5px;color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.5)}
.fl.fa{background:#c8341c}.fl.fb{background:#2f78cf}.fl.ft{background:#3d3a37}.fl.fs{background:#6b6258}
/* state: tapped = upright but dimmed + tilted + labelled (never rotated text) */
.slot.tap{width:var(--bw)}
.slot.tap .bc,.slot.tap .card{transform:rotate(5deg);margin-block:0}
.bc.tapped{filter:grayscale(.55) brightness(.72);opacity:.95}
.bc.tapped::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(0,0,0,.14) 0 6px,transparent 6px 12px);pointer-events:none}
.slot{width:var(--bw);gap:4px}
.slot.atk-me{transform:translateY(-14px)}
.slot.atk-opp{transform:translateY(14px)}
.bc.atk{box-shadow:0 0 0 4px #e0452a,0 0 18px #e0452a}
.bc.blk{box-shadow:0 0 0 4px #5da2f0,0 0 16px #5da2f0}
.bc.sel{box-shadow:0 0 0 4px var(--glow),0 0 16px var(--glow)}
.bc.valid{box-shadow:0 0 0 4px var(--glow),0 0 20px var(--glow)}
.bc:hover{transform:translateY(-3px);z-index:2}
.slot.tap .bc:hover{transform:rotate(5deg) translateY(-3px)}
.chip{font:700 11px/1.2 var(--ui);padding:3px 6px}
.blocknote{font:700 11px/1.15 var(--ui);max-width:var(--bw);color:#9cc6f2}
/* sides */
.side{display:flex;flex-direction:column;gap:12px;padding:10px 10px 12px;border-radius:18px;position:relative}
.side.opp{background:linear-gradient(180deg,rgba(208,86,59,.12),rgba(208,86,59,.03));box-shadow:inset 0 0 0 1px rgba(208,86,59,.28),inset 4px 0 0 rgba(208,86,59,.7)}
.side.me{background:linear-gradient(0deg,rgba(93,162,240,.12),rgba(93,162,240,.03));box-shadow:inset 0 0 0 1px rgba(93,162,240,.3),inset 4px 0 0 rgba(93,162,240,.75)}
.side .row{position:relative;overflow:visible;flex-wrap:wrap;gap:10px;padding:30px 10px 10px;min-height:calc(var(--bh) + 36px);background:rgba(6,10,15,.38);border:1px solid rgba(255,255,255,.09);align-items:flex-end}
.side .row.opp{align-items:flex-start}
.side .row.lands{min-height:0;padding:20px 10px 10px;align-items:center;gap:8px}
.side .row.others{min-height:0;--bw:88px;--bh:116px;background:rgba(6,10,15,.3)}
.side .row[data-zone]::before{content:attr(data-zone);position:absolute;left:12px;top:-1px;transform:translateY(-50%);font:800 10px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;padding:4px 9px;border-radius:999px;background:#10181f;border:1px solid rgba(255,255,255,.16);color:#a9b7c2}
.side.opp .row.creatures::before{color:#f2a08e}.side.me .row.creatures::before{color:#9cc6f2}
.row.dens1{--bw:92px;--bh:128px}
.row.dens2{--bw:78px;--bh:108px}
.row.dens1 .nm,.row.dens2 .nm{font-size:11.5px}
.row.dens2 .kws{display:none}
.row.dens2 .pt{font-size:18px}
.side .row .empty{font-size:13px;color:#7b8a96}
/* lands */
.landg{gap:8px;padding:6px 10px 6px 6px;border-width:2px;font:700 13px/1 var(--ui);min-height:38px}
.landg .lp{display:flex;gap:2px}
.landg .ln{white-space:nowrap}
.landg .lc{font:600 12px/1 var(--ui);opacity:.8}
.landg .lc b{font-size:16px;font-weight:800;opacity:1}
.landg .dot{width:9px;height:16px}
.landg.dim{opacity:.6}
/* player bars */
.who{padding:6px 16px 6px 8px}
.life{font-size:38px;min-width:54px}
.pname{font-size:15px}
.zinfo{font:600 13px/1 var(--ui)}
.zbtn{font-size:13px;padding:5px 10px}
.mid{padding:10px 14px}
.prompt{font-size:15px}
.ph{font-size:10.5px;padding:6px 8px}
@media (max-width:560px){
  :root{--bw:84px;--bh:118px;--hw:96px;--hh:138px}
  .bc .ty{display:block;font-size:8.5px}
  .bc .nm{font-size:11px}
  .bc .pt{font-size:18px;padding:2px 6px}
  .bc .kw{font-size:8px;padding:2px 3px}
  .row.dens1{--bw:74px;--bh:104px}.row.dens2{--bw:66px;--bh:94px}
  .side .row.others{--bw:74px;--bh:104px}
  .side{padding:8px 6px 10px;border-radius:14px}
  .side .row{gap:8px;padding:28px 6px 8px}
  .bc .badges{bottom:24px}
  .life{font-size:30px;min-width:40px}
  .landg{padding:5px 8px 5px 5px}
  #duelView .pip{width:20px;height:20px;font-size:12px}
  .hc .nm{font-size:12px}
}
/* ===== v37 original-style duel layout: left panel + wide board ===== */
#duelView.table{grid-template-columns:248px minmax(0,1fr);gap:14px;align-items:start}
body.fitduel{overscroll-behavior:none;overflow:hidden}

.pl .pname{font:700 14px/1.15 var(--ui);min-width:0;overflow:hidden}
.pl .pname small{font-size:11px;font-weight:500;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .life{font:400 60px/1 var(--display);color:#f6d561;text-shadow:0 2px 0 #3a2a08,0 0 14px rgba(246,213,97,.25);min-width:0;letter-spacing:-.01em}
.pl .life.low{color:#ff7a5f;text-shadow:0 2px 0 #3b0f06,0 0 14px rgba(255,100,70,.35)}
.zrow{display:flex;gap:10px;align-items:center}
.lib{position:relative;width:46px;height:64px;flex-shrink:0}
.lib::before,.lib i{content:"";position:absolute;inset:0;border-radius:6px;border:2px solid #7d5a2a;background:repeating-linear-gradient(45deg,#3b2a18 0 5px,#4a3520 5px 10px)}
.lib:empty::before,.lib.zero::before{opacity:.25}
.lib i:nth-child(1){transform:translate(3px,-3px)}
.lib i:nth-child(2){transform:translate(6px,-6px)}
.lib i:nth-child(3){transform:translate(9px,-9px)}
.lib::before{transform:none}
.lib b{position:absolute;inset:0;display:grid;place-items:center;font:800 17px/1 var(--head);color:#fff;text-shadow:0 1px 3px #000,0 0 6px #000;z-index:4}
.lib{margin:0 10px 8px 0}
.pl .zinfo{flex-direction:column;gap:5px;align-items:flex-start}
.pl .zbtn{white-space:nowrap}
.poolcol{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.pr{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0 4px;border-radius:10px;background:rgba(255,255,255,.04);opacity:.5}
.pr.on{opacity:1;background:rgba(246,213,97,.16);box-shadow:inset 0 0 0 1px rgba(246,213,97,.55)}
.pr b{font:800 14px/1 var(--ui);font-variant-numeric:tabular-nums}
.pr .pip{width:22px;height:22px}
.prev-panel{padding:8px}
.prev-panel .big{max-width:none;width:100%}
.prev-panel h3{display:none}
.chain{padding:8px 12px 10px;border-radius:14px;background:rgba(242,204,92,.07);border:1px solid rgba(242,204,92,.35)}
.chain h3{margin:0 0 6px;font:800 10px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
.chain .stack{display:flex;gap:8px;flex-wrap:wrap}
.chain .sitem{font:700 13px/1.25 var(--ui);padding:6px 10px}
.foot{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:12px}
.foot .log{max-height:130px}
.hand{padding:12px 6px 8px;background:linear-gradient(0deg,rgba(0,0,0,.28),transparent);border-radius:14px;gap:10px}
@media (max-width:1100px){
  #duelView.table{grid-template-columns:210px minmax(0,1fr);gap:10px}
  .pl .life{font-size:48px}
}
@media (max-width:900px){
  #duelView.table{grid-template-columns:minmax(0,1fr);gap:10px}
  .lp,.board{display:contents}
  .lp{position:static}
  .pl.opp{order:1}.side.opp{order:2}.chain{order:3}.mid{order:4}.side.me{order:5}.pl.me{order:6}.hand{order:7}.foot{order:8}
  .prev-panel{display:none}
  .pl{flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 10px}
  .pl .who{flex-direction:row;gap:12px}
  .pl .life{font-size:40px}
  .zrow{gap:6px}
  .lib{width:30px;height:42px;margin:0 8px 6px 0}.lib b{font-size:13px}
  .pl .zinfo{flex-direction:row;flex-wrap:wrap;gap:6px;align-items:center}
  .poolcol{grid-template-columns:repeat(6,minmax(30px,1fr));flex:1 1 200px}
  .foot{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .pl .life{font-size:34px}
  .pr .pip{width:18px;height:18px;font-size:11px}
  .pr{padding:3px 0}
}

/* downloaded card art */
.art{position:relative}
.art .aimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;background:#222}
.card.scan{background:none;border:0;box-shadow:none;border-radius:4.5%;overflow:visible;aspect-ratio:5/7}
.card.scan .simg{width:100%;height:100%;display:block;border-radius:4.5%;box-shadow:0 4px 14px rgba(0,0,0,.55)}
.card.scan .pt{right:6%;bottom:5%}
.artbar{height:10px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;margin:6px 0}
.artbar i{display:block;height:100%;background:var(--acc);transition:width .3s}
</style>

<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast" role="status"></div>
<div id="sr" class="sr" role="status" aria-live="polite"></div>

<script>
"use strict";
const HEADLESS = typeof document === 'undefined';

/* =====================================================================
   CARD DATABASE — classic-era cards, functional rules text only
   ===================================================================== */
const COLORS=['W','U','B','R','G'];
const CNAME={W:'White',U:'Blue',B:'Black',R:'Red',G:'Green'};
const DB={};
function D(o){ o.kw=o.kw||[]; o.text=o.text||''; DB[o.id]=o; return o; }
function isCreatureD(d){ return /Creature/.test(d.type); }
const TG={
  any:{k:'any',label:'any target'},
  creature:{k:'card',f:c=>isCreature(c),label:'a creature'},
  player:{k:'player',label:'a player'},
  spell:{k:'spell',label:'a spell'},
  permanent:{k:'card',f:()=>true,label:'a permanent'},
  land:{k:'card',f:c=>isLand(c),label:'a land'},
  artEnch:{k:'card',f:c=>isArtifact(c)||isEnch(c),label:'an artifact or enchantment'},
  tapped:{k:'card',f:c=>isCreature(c)&&c.tapped,label:'a tapped creature'},
  terror:{k:'card',f:c=>isCreature(c)&&!isArtifact(c)&&!hasColor(c,'B'),label:'a nonartifact, nonblack creature'},
  icy:{k:'card',f:c=>isArtifact(c)||isCreature(c)||isLand(c),label:'an artifact, creature or land'},
};
function L(id,name,col){ D({id,name,cost:'',type:'Basic Land',sub:name,produce:col,basic:true,text:`{T}: Add {${col}}.`}); }
L('plains','Plains','W');L('island','Island','U');L('swamp','Swamp','B');L('mountain','Mountain','R');L('forest','Forest','G');
function Cr(id,name,cost,sub,p,t,kw,text,more){ return D(Object.assign({id,name,cost,type:'Creature',sub,p,t,kw,text,ai:'creature'},more||{})); }
const dmgAb=(n,self,cost,tap)=>({cost:cost||'',tap:tap!==false,target:TG.any,ai:'ping',n,self:self||0,
  resolve:x=>{ damageRef(x.src,x.targets[0],n); if(self) dealDamage(x.src,{kind:'player',pid:x.ctrl},self); }});
const selfOk=x=>onBf(x.src);

// White
Cr('savannah_lions','Savannah Lions','W','Cats',2,1,[],'');
Cr('white_knight','White Knight','WW','Knight',2,2,['firstStrike','proB'],'First strike. Protection from black.');
Cr('serra_angel','Serra Angel','3WW','Angel',4,4,['flying','vigilance'],'Flying. Attacking does not cause Serra Angel to tap.');
Cr('pearled_unicorn','Pearled Unicorn','2W','Unicorn',2,2,[],'');
Cr('mesa_pegasus','Mesa Pegasus','1W','Pegasus',1,1,['flying','banding'],'Flying. Banding.');
Cr('wall_of_swords','Wall of Swords','3W','Wall',3,5,['defender','flying'],'Flying. Walls cannot attack.');
D({id:'swords_to_plowshares',name:'Swords to Plowshares',cost:'W',type:'Instant',target:TG.creature,ai:'removal',
  text:'Remove target creature from the game. Its controller gains life equal to its power.',
  resolve:x=>{ const c=tObj(x.targets[0]); const n=Math.max(0,pow(c)); const cp=ctrl(c); moveTo(c,'exile'); log(`${c.d.name} is removed from the game.`); gainLife(cp,n); }});
D({id:'healing_salve',name:'Healing Salve',cost:'W',type:'Instant',target:TG.any,ai:'salve',text:'Choose one — Target player gains 3 life; or prevent the next 3 damage that would be dealt to target creature or player this turn.',
  resolve:async x=>{ const t=x.targets[0];
    if(t.kind==='card'){ addShield(t,3); return; }
    let mode='life';
    if(!aiQ(x.ctrl)&&!HEADLESS) mode=await askChoice('Healing Salve',`Choose a mode for ${playerName(t.pid)}.`,[['life','Gain 3 life'],['shield','Prevent the next 3 damage this turn']]);
    else if(g.players[x.ctrl].ai&&g.players[t.pid].life>12) mode='shield';
    if(mode==='shield') addShield(t,3); else gainLife(t.pid,3); }});
D({id:'disenchant',name:'Disenchant',cost:'1W',type:'Instant',target:TG.artEnch,ai:'disenchant',text:'Destroy target artifact or enchantment.',
  resolve:x=>destroy(tObj(x.targets[0]))});
D({id:'wrath_of_god',name:'Wrath of God',cost:'2WW',type:'Sorcery',ai:'wrath',text:'Destroy all creatures. They cannot be regenerated.',
  resolve:x=>{ for(const c of g.bf.filter(isCreature)) destroy(c,true); }});
D({id:'holy_strength',name:'Holy Strength',cost:'W',type:'Enchantment',sub:'Aura',target:TG.creature,aura:{p:1,t:2},ai:'aura',text:'Enchant creature. Enchanted creature gets +1/+2.'});
D({id:'crusade',name:'Crusade',cost:'WW',type:'Enchantment',anthem:{color:'W',p:1,t:1},ai:'anthem',text:'All white creatures get +1/+1.'});

// White — batch 1
TG.blocker={k:'card',f:c=>isCreature(c)&&!!c.blocking,label:'a blocking creature'};
Cr('armored_pegasus','Armored Pegasus','1W','Pegasus',1,2,['flying'],'Flying.');
Cr('venerable_monk','Venerable Monk','2W','Cleric',2,2,[],'When Venerable Monk enters the battlefield, you gain 2 life.',{etb:x=>gainLife(x.ctrl,2)});
Cr('master_decoy','Master Decoy','W','Soldier',1,1,[],'{W}, {T}: Tap target creature.',
  {abilities:[{cost:'W',tap:true,target:TG.creature,ai:'icy',resolve:x=>{ const c=tObj(x.targets[0]); c.tapped=true; log(`${c.d.name} is tapped.`); }}]});
Cr('archangel','Archangel','5WW','Angel',5,5,['flying','vigilance'],'Flying. Attacking does not cause Archangel to tap.');
D({id:'armageddon',name:'Armageddon',cost:'3W',type:'Sorcery',ai:'armageddon',text:'Destroy all lands.',resolve:x=>{ for(const c of g.bf.filter(isLand)) destroy(c); }});
D({id:'moat',name:'Moat',cost:'2WW',type:'Enchantment',ai:'moat',text:'Creatures without flying cannot attack.'});
D({id:'karma',name:'Karma',cost:'2WW',type:'Enchantment',ai:'karma',text:"At the beginning of each player's upkeep, Karma deals damage to that player equal to the number of Swamps they control.",
  upkeep:x=>{ const k=g.bf.filter(l=>isLand(l)&&ctrl(l)===x.pid&&hasLT(l,'Swamp')).length; if(k) dealDamage(x.src,{kind:'player',pid:x.pid},k); }});
D({id:'righteousness',name:'Righteousness',cost:'W',type:'Instant',target:TG.blocker,ai:'righteous',text:'Target blocking creature gets +7/+7 until end of turn.',
  resolve:x=>{ const c=tObj(x.targets[0]); c.temp.p+=7; c.temp.t+=7; }});
D({id:'holy_light',name:'Holy Light',cost:'2W',type:'Instant',ai:'holylight',text:'Nonwhite creatures get -1/-1 until end of turn.',
  resolve:x=>{ for(const c of g.bf.filter(c=>isCreature(c)&&!hasColor(c,'W'))){ c.temp.p--; c.temp.t--; } }});
D({id:'angelic_blessing',name:'Angelic Blessing',cost:'2W',type:'Sorcery',target:TG.creature,ai:'blessing',text:'Target creature gets +3/+3 and gains flying until end of turn.',
  resolve:x=>{ const c=tObj(x.targets[0]); c.temp.p+=3; c.temp.t+=3; c.temp.kw.push('flying'); }});
D({id:'spirit_link',name:'Spirit Link',cost:'W',type:'Enchantment',sub:'Aura',target:TG.creature,aura:{link:true},ai:'aura',text:'Enchant creature. Whenever enchanted creature deals damage, you gain that much life.'});

// White — batch 2: banding, damage prevention, graveyard returns, Balance
TG.gyCreature={k:'gy',f:(c,src)=>isCreature(c)&&c.owner===src.owner,label:'a creature card in your graveyard'};
TG.gyAny={k:'gy',f:(c,src)=>c.owner===src.owner,label:'a card in your graveyard'};
Cr('benalish_hero','Benalish Hero','W','Benalish Hero',1,1,['banding'],'Banding.');
Cr('samite_healer','Samite Healer','1W','Cleric',1,1,[],'{T}: Prevent the next 1 damage that would be dealt to any target this turn.',
  {abilities:[{tap:true,target:TG.any,ai:'samite',resolve:x=>addShield(x.targets[0],1)}]});
for(const [col,nm] of [['W','White'],['U','Blue'],['B','Black'],['R','Red'],['G','Green']])
  D({id:'cop_'+col.toLowerCase(),name:'Circle of Protection: '+nm,cost:'1W',type:'Enchantment',ai:'cop',
    text:`{1}: The next time a ${nm.toLowerCase()} source of your choice would deal damage to you this turn, prevent that damage.`,
    abilities:[{cost:'1',ai:'cop',col,resolve:x=>{ g.players[x.ctrl].cop.push(x.src.sleight&&x.src.sleight.from===col?x.src.sleight.to:col); log(`${playerName(x.ctrl)} prepares protection from ${nm.toLowerCase()} sources.`); }}]});
D({id:'resurrection',name:'Resurrection',cost:'2WW',type:'Sorcery',target:TG.gyCreature,ai:'resurrect',text:'Return target creature card from your graveyard to the battlefield.',
  resolve:x=>{ const c=byIid(x.targets[0].iid); moveTo(c,'bf'); c.controller=x.ctrl; c.sick=true; log(`${c.d.name} returns to the battlefield.`); if(c.d.etb) c.d.etb({src:c,ctrl:x.ctrl}); }});
D({id:'raise_dead',name:'Raise Dead',cost:'B',type:'Sorcery',target:TG.gyCreature,ai:'raise',text:'Return target creature card from your graveyard to your hand.',
  resolve:x=>{ const c=byIid(x.targets[0].iid); moveTo(c,'hand'); log(`${c.d.name} returns to ${playerName(x.ctrl)}'s hand.`); }});
D({id:'regrowth',name:'Regrowth',cost:'1G',type:'Sorcery',target:TG.gyAny,ai:'regrow',text:'Return target card from your graveyard to your hand.',
  resolve:x=>{ const c=byIid(x.targets[0].iid); moveTo(c,'hand'); log(`${c.d.name} returns to ${playerName(x.ctrl)}'s hand.`); }});
D({id:'balance',name:'Balance',cost:'1W',type:'Sorcery',ai:'balance',
  text:'Each player chooses a number of lands they control equal to the number of lands controlled by the player who controls the fewest, then sacrifices the rest. Players discard cards and sacrifice creatures the same way.',
  resolve:x=>{
    for(const kind of ['land','creature']){
      const sets=g.players.map(P=>g.bf.filter(c=>(kind==='land'?isLand(c):isCreature(c))&&ctrl(c)===P.id));
      const mn=Math.min(sets[0].length,sets[1].length);
      for(const set of sets){ const extra=set.length-mn; if(extra<=0) continue;
        const order=[...set].sort((a,b)=>kind==='land'?((b.tapped?1:0)-(a.tapped?1:0)):val(a)-val(b));
        for(let i=0;i<extra;i++) sacrifice(order[i]); }
    }
    const mh=Math.min(...g.players.map(P=>P.hand.length));
    for(const P of g.players) while(P.hand.length>mh){ const c=aiDiscardPick(P.id); moveTo(c,'graveyard'); log(`${P.name} discards ${c.d.name}.`); }
  }});

// ===== Batch 3: blue, black, red, green, artifacts =====
TG.nonblack={k:'card',f:c=>isCreature(c)&&!hasColor(c,'B'),label:'a nonblack creature'};
TG.artifact={k:'card',f:(c,src)=>isArtifact(c)&&!(src&&src.d&&src.d.aura&&guardedArt(c)),label:'an artifact'};
TG.creatureSpell={k:'spell',f:s=>isCreatureD(s.card.d),label:'a creature spell'};
const pumpAb=(cost,p,t)=>({cost,ai:'pump',p,t,resolve:x=>{ if(selfOk(x)){ x.src.temp.p+=p; x.src.temp.t+=t; x.src.pumps=(x.src.pumps||0)+1; } }});
async function counterUnlessPay(x,n,sink){
  const i=g.stack.findIndex(s=>s.sid===x.targets[0].sid); if(i<0) return;
  const it=g.stack[i], T=it.ctrl, cost=parseCost(String(n));
  let pays=false;
  if(planPay(T,cost,0).ok) pays=g.players[T].ai?true:await askPay(n,it.name);
  if(pays&&payCost(T,cost,0)){ log(`${playerName(T)} pays ${n} and ${it.name} is not countered.`); return; }
  const j=g.stack.findIndex(s=>s.sid===it.sid); if(j<0) return;
  g.stack.splice(j,1); moveTo(it.card,'graveyard'); log(`${it.name} is countered.`);
  if(sink){ for(const l of g.bf.filter(l=>isLand(l)&&ctrl(l)===T)) l.tapped=true; g.players[T].pool=zeroPool(); log(`${playerName(T)} taps all lands and empties their mana pool.`); }
}
const counterRes=x=>{ const i=g.stack.findIndex(s=>s.sid===x.targets[0].sid); if(i<0) return; const it=g.stack.splice(i,1)[0]; moveTo(it.card,'graveyard'); log(`${it.name} is countered.`); };

// Blue
Cr('wall_of_water','Wall of Water','1UU','Wall',0,5,['defender'],'{U}: Wall of Water gets +1/+0 until end of turn. Walls cannot attack.',{abilities:[pumpAb('U',1,0)]});
Cr('cloud_pirates','Cloud Pirates','1U','Human Pirate',1,1,['flying'],'Flying. Cloud Pirates can block only creatures with flying.');
Cr('water_elemental','Water Elemental','3UU','Elemental',5,4,[],'');
Cr('sea_serpent','Sea Serpent','5U','Serpent',5,5,[],'Sea Serpent cannot attack unless defending player controls an Island.');
Cr('lord_of_atlantis','Lord of Atlantis','UU','Lord',2,2,[],'Other Merfolk get +1/+1 and have islandwalk.',{anthem:{sub:'Merfolk',p:1,t:1,grant:'islandwalk'}});
D({id:'time_walk',name:'Time Walk',cost:'1U',type:'Sorcery',ai:'timewalk',text:'Take an extra turn after this one.',resolve:x=>{ g.extra++; log(`${playerName(x.ctrl)} will take an extra turn.`); }});
D({id:'braingeyser',name:'Braingeyser',cost:'XUU',type:'Sorcery',target:TG.player,ai:'brain',text:'Target player draws X cards.',resolve:x=>drawCards(x.targets[0].pid,x.x)});
D({id:'spell_blast',name:'Spell Blast',cost:'XU',type:'Interrupt',target:TG.spell,ai:'spellblast',text:'Counter target spell with mana value X.',
  resolve:x=>{ const i=g.stack.findIndex(s=>s.sid===x.targets[0].sid); if(i<0) return; const it=g.stack[i];
    if(cmcOf(it.card.d)!==x.x){ log(`Spell Blast does nothing — ${it.name} does not have mana value ${x.x}.`); return; }
    g.stack.splice(i,1); moveTo(it.card,'graveyard'); log(`${it.name} is countered.`); }});
D({id:'remove_soul',name:'Remove Soul',cost:'1U',type:'Interrupt',target:TG.creatureSpell,ai:'counter',text:'Counter target creature spell.',resolve:counterRes});
D({id:'twiddle',name:'Twiddle',cost:'U',type:'Instant',target:TG.icy,ai:'twiddle',text:'Tap or untap target artifact, creature or land. (Yours untaps, theirs taps.)',
  resolve:x=>{ const c=tObj(x.targets[0]); c.tapped=ctrl(c)!==x.ctrl; log(`${c.d.name} is ${c.tapped?'tapped':'untapped'}.`); }});
D({id:'jump',name:'Jump',cost:'U',type:'Instant',target:TG.creature,ai:'jump',text:'Target creature gains flying until end of turn.',resolve:x=>{ tObj(x.targets[0]).temp.kw.push('flying'); }});
D({id:'power_sink',name:'Power Sink',cost:'XU',type:'Interrupt',target:TG.spell,ai:'unlesspay',
  text:"Counter target spell unless its controller pays {X}. If they don't, they tap all lands they control and empty their mana pool.",resolve:x=>counterUnlessPay(x,x.x,true)});
D({id:'mana_leak',name:'Mana Leak',cost:'1U',type:'Interrupt',target:TG.spell,ai:'unlesspay',fixedX:3,
  text:'Counter target spell unless its controller pays {3}.',resolve:x=>counterUnlessPay(x,3,false)});
TG.redThing={k:'multi',label:'a red spell or red permanent',specs:[{k:'spell',f:s=>hasColor(s.card,'R')},{k:'card',f:c=>hasColor(c,'R')}]};
TG.blueThing={k:'multi',label:'a blue spell or blue permanent',specs:[{k:'spell',f:s=>hasColor(s.card,'U')},{k:'card',f:c=>hasColor(c,'U')}]};
const blastRes=x=>{ const r=x.targets[0];
  if(r.kind==='stack'){ const i=g.stack.findIndex(s=>s.sid===r.sid); if(i<0) return; const it=g.stack.splice(i,1)[0]; moveTo(it.card,'graveyard'); log(`${it.name} is countered.`); }
  else destroy(byIid(r.iid)); };
D({id:'blue_elemental_blast',name:'Blue Elemental Blast',cost:'U',type:'Interrupt',target:TG.redThing,ai:'blast',text:'Choose one — Counter target red spell; or destroy target red permanent.',resolve:blastRes});
D({id:'red_elemental_blast',name:'Red Elemental Blast',cost:'R',type:'Interrupt',target:TG.blueThing,ai:'blast',text:'Choose one — Counter target blue spell; or destroy target blue permanent.',resolve:blastRes});

// Reanimation and copying
TG.gyAnyCreature={k:'gy',f:c=>isCreature(c),label:'a creature card in a graveyard'};
D({id:'animate_dead',name:'Animate Dead',cost:'1B',type:'Enchantment',sub:'Aura',target:TG.gyAnyCreature,aura:{p:-1,t:0,reanimate:true},ai:'animate',
  text:"Enchant creature card in a graveyard. When Animate Dead enters the battlefield, return the enchanted creature card to the battlefield under your control and attach Animate Dead to it. When Animate Dead leaves the battlefield, that creature's controller sacrifices it. Enchanted creature gets -1/-0."});
Cr('clone','Clone','3U','Clone',0,0,[],'You may have Clone enter the battlefield as a copy of any creature on the battlefield.',{clone:true,ai:'clone'});

// ===== Batch 4: mana =====

function anteTop(pid){ const P=g.players[pid]; const c=P.library.pop(); if(!c){ log(`${P.name} has no card to ante.`); return null; } c.zone='ante'; g.ante.push(c); log(`${P.name} antes ${c.d.name}.`,pid); return c; }
function anteResult(){ const gained=[],lost=[]; const w=g.over&&g.over.winner; if(w!==0&&w!==1) return {gained,lost};
  const L=1-w; for(const c of g.cards.values()){ if(c.copy) continue; let fin=c.owner; if(c.zone==='ante'&&c.owner===L) fin=w;
    if(c.own0===0&&fin!==0) lost.push(c.id); else if(c.own0===1&&fin===0) gained.push(c.id); } return {gained,lost}; }

class Abort extends Error{}

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function pause(ms){ const id=g.id; await sleep(HEADLESS?0:ms*ui.speed); if(!g||g.id!==id) throw new Abort(); if(g.over) throw new Over(); }
async function pickNewTarget(p,spec,src,label,prefer,avoid){
  const cands=allRefs().filter(r=>legal(spec,r,src)&&!(avoid&&avoid.kind===r.kind&&avoid.pid===r.pid&&avoid.iid===r.iid&&avoid.sid===r.sid));
  if(!cands.length) return null;
  if(g.players[p].ai){
    const sc=r=>{ if(r.kind==='player') return (r.pid===(prefer==='opp'?1-p:prefer==='self'?p:prefer))?100:-50;
      const c=byIid(r.iid); if(!c) return -100; const mine=ctrl(c)===(prefer==='opp'?1-p:prefer==='self'?p:prefer); return (mine?40:-40)+(isCreature(c)?val(c):0); };
    return cands.sort((a,b)=>sc(b)-sc(a))[0];
  }
  if(HEADLESS) return cands[0];
  return await askNewTarget(spec,src,label);
}
async function upkeepPay(x,cost,fail){
  const p=x.pid, c=cost.match?parseCost(cost):cost;
  if(!planPay(p,c,0).ok) return false;
  let yes=true;
  if(!aiQ(p)&&!HEADLESS) yes=await askUpkeep(x.src.d.name,cost,fail);
  if(yes) payCost(p,c,0);
  return yes;
}
async function upkeepMay(x,cost,yesText,noText){
  const p=x.pid, c=parseCost(cost); if(!planPay(p,c,0).ok) return false;
  let yes=true;
  if(!aiQ(p)&&!HEADLESS) yes=await askChoice(x.src.d.name,`${yesText}`,[['y','Yes'],['n',noText||'No']])==='y';
  if(yes) payCost(p,c,0);
  return yes;
}
async function searchLib(p,f,label,dest,opts){
  opts=opts||{}; const P=g.players[p];
  const cs=P.library.filter(f);
  let pick=null;
  if(cs.length){
    if(P.ai) pick=cs.slice().sort((a,b)=>(dest==='top'||dest==='hand')?aiTutorScore(P,b)-aiTutorScore(P,a):val(b)-val(a))[0];
    else if(HEADLESS) pick=cs[0];
    else { const iid=await askLibrary(cs,label); pick=iid==null?null:cs.find(c=>c.iid===iid)||null; }
  }
  log(pick?(P.ai?`${P.name} searches their library.`:`You search your library for ${pick.d.name}.`):`${P.name} searches their library and finds nothing.`,p);
  P.library=shuffle(P.library.filter(c=>c!==pick));
  if(!pick) return null;
  if(dest==='hand'){ pick.zone='hand'; P.hand.push(pick); }
  else if(dest==='top'){ pick.zone='library'; P.library.push(pick); log(`${P.name} puts a card on top of their library.`,p); }
  else { pick.zone='bf'; pick.controller=p; pick.tapped=!!opts.tapped; g.bf.push(pick); log(`${pick.d.name} enters the battlefield${opts.tapped?' tapped':''}.`,p); }
  return pick;
}
function aiTutorScore(P,c){
  const d=c.d; let s=cmcOf(d);
  if(isLand(c)){ const lands=P.hand.filter(isLand).length+g.bf.filter(l=>isLand(l)&&ctrl(l)===P.id).length; return lands<4?60:-5; }
  if(isCreatureD(d)) s+=6; if(d.ai==='lde'||d.ai==='wrath'||d.ai==='removal') s+=8; if(d.id==='time_walk'||d.id==='ancestral_recall') s+=14;
  const lands=g.bf.filter(l=>isLand(l)&&ctrl(l)===P.id).length;
  if(cmcOf(d)>lands+2) s-=8;
  return s;
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function parseCost(s){ const c={generic:0,W:0,U:0,B:0,R:0,G:0,x:false}; for(const t of ((s||'').match(/\d+|[WUBRGXQ]/g)||[])){ if(/\d/.test(t)) c.generic+=+t; else if(t==='X'){ c.x=true; c.xn=(c.xn||0)+1; } else if(t==='Q'){ c.x=true; c.xcol='R'; } else c[t]++; } return c; }
function cmcOf(d){ const c=parseCost(d.cost); return c.generic+c.W+c.U+c.B+c.R+c.G; }
function colorsOfD(d){ if(d.colOv) return [d.colOv]; return COLORS.filter(k=>(d.cost||'').includes(k)); }
const zeroPool=()=>({W:0,U:0,B:0,R:0,G:0,C:0});
let PAYCARD=null;
const payCtx=(c,fn)=>{ const o=PAYCARD; PAYCARD=c; try{ return fn(); } finally{ PAYCARD=o; } };
function costOf(c){ const cost=parseCost(c.d.cost); if(typeof g!=='undefined'&&g&&g.bf&&!isLand(c)){ const n=g.bf.filter(k=>k.d.id==='stone_calendar'&&ctrl(k)===c.owner).length; if(n) cost.generic=Math.max(0,cost.generic-n); } if(typeof g!=='undefined'&&g&&g.bf&&!isLand(c)){ let r=0; if(isCreatureD(c.d)) r+=2*g.bf.filter(k=>k.d.id==='planar_gate'&&ctrl(k)===c.owner).length; if(isInstantD(c.d)||c.d.type==='Enchantment') r+=2*g.bf.filter(k=>k.d.id==='mana_matrix'&&ctrl(k)===c.owner).length; if(r) cost.generic=Math.max(0,cost.generic-r); }
  if(typeof g!=='undefined'&&g&&g.bf&&!isLand(c)&&hasColor(c,'W')) cost.generic+=3*g.bf.filter(k=>k.d.id==='gloom').length; return cost; }
function abCost(c,ab){ const k=parseCost(ab.cost); if(isArtifact(c)&&g.bf.some(a=>a.attachedTo===c.iid&&a.d.aura&&a.d.aura.powerArt)){ const tot=k.generic+k.W+k.U+k.B+k.R+k.G; const cut=Math.min(2,k.generic,Math.max(0,tot-1)); k.generic-=cut; } if(/Enchantment/.test(c.d.type)&&hasColor(c,'W')) k.generic+=3*g.bf.filter(m=>m.d.id==='gloom').length; return k; }

async function pickFrom(p,title,text,items,label,aiPick){ if(!items.length) return null; if(aiQ(p)||HEADLESS||g.players[p].remote) return aiPick?aiPick(items):items[0]; const r=await askChoice(title,text,items.map((k,i)=>[String(i),label(k)])); return items[+r]||items[0]; }
function srcChoices(){ return [...g.bf.filter(k=>isCreature(k)),...g.stack.filter(s=>s.kind==='spell').map(s=>s.card)]; }
async function pickSource(p,title){ return pickFrom(p,title,'Choose a source.',srcChoices(),k=>k.d.name+(k.zone==='stack'?' (spell)':''),it=>it.find(k=>k.zone==='stack'&&k.controller!==p)||it.filter(k=>k.zone==='bf'&&ctrl(k)!==p).sort((a,b)=>(b.attacking?1:0)-(a.attacking?1:0)||pow(b)-pow(a))[0]||it[0]); }
const oneShotFx=(fx)=>{ (g.dmgFx=g.dmgFx||[]).push(fx); };
const dropFx=e=>{ const i=(g.dmgFx||[]).indexOf(e); if(i>=0) g.dmgFx.splice(i,1); };
const TG_myAEL={k:'card',f:(c,s)=>ctrl(c)===ctrl(s)&&(isArtifact(c)||isCreature(c)||isLand(c)),label:'an artifact, creature or land you control'};
const typesOfPerm=c=>[isArtifact(c)&&'a',isCreature(c)&&'c',isLand(c)&&'l'].filter(Boolean);
const TG_blkWall={k:'card',f:(c,s)=>isCreature(c)&&/Wall/.test(c.d.sub||'')&&c.blocking!=null&&ctrl(c)===ctrl(s),label:'a blocking Wall you control'};
const spellTargetsMine=(s,pid)=>s.targets.some(r=>(r.kind==='card'&&byIid(r.iid)&&ctrl(byIid(r.iid))===pid));
const TG_instAura={k:'spell',f:(s,src)=>s.kind==='spell'&&(isInstantD(s.card.d)||!!s.card.d.aura)&&s.sid!==(src&&src.sid)&&spellTargetsMine(s,ctrl(src)),label:'an instant or Aura spell that targets a permanent you control'};

function dealCombat(first,hadFS){
  for(const c of g.bf) if(c.faceDown&&(c.attacking||c.blocking!=null)) turnFaceUp(c);
  if(g.fog){ if(first||!hadFS) log('All combat damage is prevented.'); return; }
  const deals=c=>!c.nodmg&&c.spuzT!==g.turn&&(first?hasKw(c,'firstStrike'):!(hadFS&&hasKw(c,'firstStrike')));
  const ev=[];
  for(const a of g.bf.filter(c=>c.attacking)){
    if(!deals(a)) continue;
    let n=pow(a); if(n<=0) continue;
    const dp=1-ctrl(a);
    if(!a.wasBlocked){ ev.push([a,{kind:'player',pid:dp},n]); continue; }
    const bs=a.blockedBy.map(byIid).filter(b=>b&&onBf(b)&&b.blocking!=null);
    if(bs.length&&bs.some(b=>hasKw(b,'banding')||(b.d.bandsWith&&b.noBandsT!==g.turn&&bs.filter(x=>x.d.name===b.d.bandsWith).length>=2)||(bandsLeg(b)&&bs.filter(x=>/Legendary/.test(x.d.type)).length>=2))){ bs.sort((x,y)=>(tough(y)-y.damage)-(tough(x)-x.damage)); ev.push([a,bs[0],n]); continue; }
    if(!bs.length){ if(hasKw(a,'trample')) ev.push([a,{kind:'player',pid:dp},n]); continue; }
    bs.forEach((b,i)=>{
      if(n<=0) return;
      const lethal=Math.max(0,tough(b)-b.damage);
      const last=i===bs.length-1;
      const amt=(last&&!hasKw(a,'trample'))?n:Math.min(n,lethal);
      if(amt>0){ ev.push([a,b,amt]); n-=amt; }
    });
    if(n>0&&hasKw(a,'trample')) ev.push([a,{kind:'player',pid:dp},n]);
  }
  for(const b of g.bf.filter(c=>c.blocking)){
    if(!deals(b)) continue;
    if(b.blockAlso&&b.blockAlso.length){ let n=pow(b); const ts=[b.blocking,...b.blockAlso].map(byIid).filter(t=>t&&onBf(t)); ts.forEach((t,i)=>{ if(n<=0) return; const lethal=Math.max(0,tough(t)-t.damage); const amt=i===ts.length-1?n:Math.min(n,lethal); if(amt>0){ ev.push([b,t,amt]); n-=amt; } }); continue; }

    if(a&&onBf(a)&&n>0) ev.push([b,a,n]);

  const sum={};
  for(const [s,t,n] of ev){ const k=t.kind==='player'?playerName(t.pid):t.d.name; sum[k]=(sum[k]||0)+n; }
  const parts=Object.entries(sum).map(([k,n])=>`${n} to ${k}`);
  if(parts.length) log(`${first?'First-strike damage':'Combat damage'}: ${parts.join(', ')}.`);
}

function aiAttackersV0(p){

function aiBlockersV0(p,attackers){

      const col=ab.col, have=P.cop.filter(k=>k===col).length;
      if(S.inResp){ const t=S.top, sd=t.kind==='spell'?t.card.d:t.src.d; const me=t.targets.some(r=>r.kind==='player'&&r.pid===p);
        if(me&&colorsOfD(sd).includes(col)&&(t.kind==='spell'?(t.card.d.ai==='burn'||t.card.d.ai==='xburn'):t.ab.ai==='ping')) return R(120); }

    case 'fountain': return (S.oppEnd&&P.life<20)?R(8):null;
    case 'scepter': return (S.main&&g.active===p&&g.players[O].hand.length>=2)?R(15,[face]):null;
    case 'pump': {
      if((c.pumps||0)>=3) return null;

      if(S.block&&!S.top&&ab.t>0&&(c.attacking||c.blocking)&&wouldDieInCombat(c)){ c.temp.t+=1; const still=wouldDieInCombat(c); c.temp.t-=1; if(!still) return R(60); }
      return null;
    }
    case 'fly': return (S.my&&g.step==='attack'&&!S.top&&c.attacking&&!hasKw(c,'flying'))?R(20):null;
    case 'regen': {

      if(S.block&&!S.top&&wouldDieInCombat(c)) return R(120);
      return null;
    }
  }
  return null;
}

function waitHuman(kind,data){
  const id=g.id;
  return new Promise((res,rej)=>{ ui.wait={kind,data:data||{},res:v=>{ ui.wait=null; res(v); },rej}; render(); })
    .then(v=>{ if(!g||g.id!==id) throw new Abort(); return v; });
}
function canHumanAct(p=0){
  for(const c of g.players[p].hand){ if(isLand(c)||!isInstantD(c.d)||c.d.ai==='ritual') continue; if(castableNow(p,c)) return true; }
  for(const c of g.bf){ for(const ab of c.d.abilities||[]) if(abOK(c,ab,p)&&abilityUsable(p,c,ab)) return true; }
  return false;
}
async function humanPriority(opts){
  const top=g.stack[g.stack.length-1];
  const sorc=opts.main&&g.active===0&&!g.stack.length;
  let stop;
  if(top&&top.ctrl!==0) stop=canHumanAct()||ui.fullControl;
  else if(ui.skipTurn===g.turn&&g.active===0) stop=false;
  else if(sorc) stop=true;
  else if(ui.fullControl) stop=true;
  else stop=!!opts.stop&&canHumanAct();
  if(!stop) return false;
  const r=await waitHuman('priority',{sorc,opts});
  return r==='acted';
}
async function humanAttackers(able){
  const forced=able.filter(c=>c.d.mustAttack||c.forceAtk===g.turn);
  if(ui.skipTurn===g.turn) return forced;
  ui.attack=new Set(forced.map(c=>c.iid));
  ui.attackable=new Set(able.map(c=>c.iid));
  await waitHuman('attack');
  const sel=[...ui.attack].map(byIid);
  ui.attack=null; ui.attackable=null;
  return sel;
}
async function humanBlockers(attackers){
  const can=g.bf.some(b=>ctrl(b)===0&&attackers.some(a=>canBlock(b,a)));
  if(!can) return [];
  ui.blocks=new Map(); ui.blockSel=null;
  await waitHuman('block');
  const out=[...ui.blocks].map(([b,a])=>[byIid(b),byIid(a)]);
  ui.blocks=null; ui.blockSel=null;
  return out;
}

  if(ui.wait&&ui.wait.rej){ const w=ui.wait; ui.wait=null; try{ w.rej(new Abort()); }catch(e){} }
  if(NET.wait&&NET.wait.rej){ const w=NET.wait; NET.wait=null; try{ w.rej(new Abort()); }catch(e){} }
  Object.assign(ui,{targeting:null,preview:null,attack:null,attackable:null,blocks:null,blockSel:null,skipTurn:-1});
  IID=1; SID=1;
  g={id:Math.random(),players:[],bf:[],stack:[],cards:new Map(),turn:0,active:0,step:'start',landsPlayed:0,log:[],over:null,oppMeta:names.meta||null,extra:0,fog:false,ante:[],antePlay:!!names.ante,side:names.side||[[],[]]};
  [[0,list0],[1,list1]].forEach(([pid,list])=>{
    const P={id:pid,name:names[pid],ai:pid===1||!!bothAI,remote:!!names.net&&pid===1,life:(names.life&&names.life[pid])||20,library:[],hand:[],graveyard:[],exile:[],pool:zeroPool(),decked:false,shield:0,cop:[]};
    for(const id of list){ const c=mkCard(id,pid); P.library.push(c); g.cards.set(c.iid,c); }

}

function promptAndActions(){
  const w=ui.wait, mine=g.active===0, top=g.stack[g.stack.length-1];
  let text='', acts=[];
  if(g.over){ text=g.over.winner===0?'You won the duel.':g.over.winner===1?'You lost the duel.':'The duel is a draw.'; acts.push(['rematch','Rematch']); }
  else if(ui.targeting){ text=ui.targeting.label; acts.push(['cancelTarget','Cancel','ghost']); }
  else if(!w){ text=mine?'Resolving…':`${esc(playerName(1))} is thinking…`; }
  else if(w.kind==='mulligan'){ text=`Opening hand of ${w.data.n}. Keep it, or shuffle and draw ${w.data.n-1}?`; acts.push(['keep','Keep hand'],['mull','Mulligan','ghost']); }
  else if(w.kind==='discard'){ text=`${w.data.exact?'Discard':'Hand limit is 7.'} Choose ${w.data.n} card${w.data.n>1?'s':''} to discard.`; }
  else if(w.kind==='attack'){ const n=ui.attack.size; text='Choose attackers: click your creatures, then confirm.'; acts.push(['confirmAttack',n?`Attack with ${n}`:'No attack']); }
  else if(w.kind==='block'){ text=ui.blockSel?'Now click the attacker it should block.':'Click one of your creatures, then an attacker to block it. Click a blocker again to cancel.'; acts.push(['confirmBlock',ui.blocks.size?`Confirm ${ui.blocks.size} block${ui.blocks.size>1?'s':''}`:'No blocks']); }
  else if(w.kind==='priority'){
    if(top&&top.ctrl!==0){ text=`<b>${esc(top.name)}</b>${top.targets.length?' → '+esc(describeTargets(top.targets)):''} is on the stack. Respond with an instant or let it resolve.`; acts.push(['pass','Let it resolve']); }
    else if(w.data.sorc){ text=g.landsPlayed<1&&g.players[0].hand.some(isLand)?'Your main phase. Play a land, cast spells, or tap lands for mana.':'Your main phase. Cast spells or move on.';
      if(g.step==='main1'){ acts.push(['pass','To combat']); acts.push(['endTurn','End turn','ghost']); } else acts.push(['pass','End turn']); }
    else { const s=STEPS.find(s=>s[0]===g.step); text=`${mine?'Your':'Their'} ${s?s[1].toLowerCase():g.step} step. You may cast instants or use abilities.`; acts.push(['pass','Pass']); }
    if(poolTotal(0)>0) text+=' <span class="muted">Unused mana causes mana burn when the step ends.</span>';
  }
  return {text,acts};
}

  const logs=g.log.slice(-90).map(l0=>({...l0,msg:youFix(l0.msg)})).map(l=>l.who==='turn'?`<div class="t">${esc(l.msg)}</div>`:`<div class="${l.who===1?'o':l.who===0?'m':''}">${esc(l.msg)}</div>`).join('');

function chooseColor(done,list){
  openModal(`<h2>Choose a color</h2><div class="hrow">${(list||COLORS).map(k=>`<button class="btn ghost" data-color="${k}">${pipHTML(k)} ${CNAME[k]}</button>`).join('')}</div><button class="btn ghost" data-color="cancel">Cancel</button>`);
  ui.modal={kind:'color',onClick:v=>{ closeModal(); if(v!=='cancel') done(v); }};
}
function humanCast(c){
  const w=ui.wait;
  if(!w||w.kind!=='priority'){ toast('Wait for your priority.'); return; }
  if(isLand(c)){
    if(!timingOK(0,c)){ toast(g.landsPlayed?'You already played a land this turn.':'Lands can only be played in your main phase with an empty stack.'); return; }
    NETX('land',c); render(); return;
  }
  if(!timingOK(0,c)){ toast(`${c.d.type}s can only be cast in your main phase with an empty stack.`); return; }
  const cost=costOf(c);
  const go=x=>{
    if(!payCtx(c,()=>planPay(0,cost,x).ok)){ toast('Not enough mana.'); return; }
    const fin0=ts=>{ if(NETX('cast',c,ts,x)){ ui.preview=c; w.res('acted'); } else toast('Not enough mana.'); };
    const fin=ts=>{ if(c.d.addSac){ const cs=g.bf.filter(k=>onBf(k)&&ctrl(k)===0&&c.d.addSac.f(k,c)); askChoice(c.d.name,'Choose a creature to sacrifice as an additional cost.',cs.map(k=>[String(k.iid),k.d.name])).then(v=>{ if(v) fin0(ts.concat([{kind:'sac',iid:+v}])); }); } else fin0(ts); };
    if(c.d.target) startTargeting(c.d.target,c,`Choose ${c.d.target.label} for ${c.d.name}.`,ref=>{ if(c.d.multiTarget) moreTargets(c,ref,c.d.targetN?c.d.targetN(x):0).then(fin); else if(c.d.target2){ const sp2=c.d.target2(ref,c); startTargeting(sp2,c,`Choose ${sp2.label} for ${c.d.name}.`,r2=>fin([ref,r2])); } else fin([ref]); });
    else fin([]);
  };
  if(cost.x){ let mx=payCtx(c,()=>maxX(0,cost)); if(c.d.targetN) mx=Math.min(mx,g.bf.filter(k=>legal(c.d.target,{kind:'card',iid:k.iid},c)).length); if(mx<1){ toast('Not enough mana for X ≥ 1.'); return; } chooseX(c,mx,go); }
  else go(0);
}
async function moreTargets(c,first,limit){ const ts=[first];
  for(;;){ if(limit&&ts.length>=limit) break; const cands=g.bf.filter(k=>legal(c.d.target,{kind:'card',iid:k.iid},c)&&!ts.some(t=>t.iid===k.iid)); if(!cands.length) break;
    const key=await askChoice(c.d.name,`Targets so far: ${ts.map(t=>byIid(t.iid).d.name).join(', ')}. Add another target?`,[...(limit?[]:[['done','Done']]),...cands.slice(0,14).map(k=>[String(k.iid),`${k.d.name} (${playerName(ctrl(k))})`])]);
    if(key==='done'||!key) break; ts.push({kind:'card',iid:+key}); }
  return ts; }
async function collectCostRefs(c,ab){ const out=[];
  if(ab.discard){ const v=await askChoice(c.d.name,'Choose a card to discard.',g.players[0].hand.map(h=>[String(h.iid),h.d.name])); if(!v) return null; out.push({kind:'hand',iid:+v}); }
  if(ab.sac){ for(;;){ const cs=g.bf.filter(k=>ctrl(k)===0&&ab.sac.spec.f(k,c)&&!out.some(o=>o.kind==='sac'&&o.iid===k.iid)); if(!cs.length) break; const opts=cs.map(k=>[String(k.iid),k.d.name+(k.tapped?' (tapped)':'')]); const have=out.some(o=>o.kind==='sac'); if(ab.sac.any&&have) opts.unshift(['done','Done choosing']);
      const v=await askChoice(c.d.name,ab.sac.any?'Choose a creature to sacrifice (as many as you like).':'Choose what to sacrifice.',opts); if(!v) return null; if(v==='done') break; out.push({kind:'sac',iid:+v}); if(!ab.sac.any) break; }
    if(!out.some(o=>o.kind==='sac')&&ab.sac.min!==0) return null; }
  return out; }
function humanUsePermanent(c){
  const w=ui.wait; if(!w||w.kind!=='priority') return;
  if(ctrl(c)!==0&&!(c.d.abilities||[]).some(a=>abOK(c,a,0)&&abilityUsable(0,c,a))){ toast('You cannot use that ability right now.'); return; }
  if(c.tapped){ const ua=(c.d.abilities||[]).find(a=>!a.mana&&!a.tap); if(ua&&abilityUsable(0,c,ua)){ if(NETX('act',c,ua,[])) w.res('acted'); else toast('Not enough mana.'); return; } toast(`${c.d.name} is tapped.`); return; }
  if(isLand(c)){
    if(isCreature(c)&&c.sick&&!hasKw(c,'haste')&&!(c.d.abilities||[]).some(a=>!a.mana)){ toast(`${c.d.name} has summoning sickness.`); return; }
    const pr=(g.players[0].deepW===g.turn&&prodOf(c))?'U':(c.gnomed&&prodOf(c)==='W')?'C':prodOf(c);
    const tapMana=()=>{ const fin=col=>{ NETX('tap',c,col); render(); };
      if(pr==='*') chooseColor(fin); else if(isDual(pr)) chooseColor(fin,[...pr]); else { const col=(c.d.produceFn&&!landOv(c))?c.d.produceFn(c):pr; if(!col){ toast(`${c.d.name} produces no mana.`); return; } fin(col); } };
    const lab=(landOv(c)&&landOv(c).strip)?[]:(c.d.abilities||[]).filter(a=>!a.mana);
    const useAb=ab=>{ if(!abilityUsable(0,c,ab)){ toast('You cannot use that ability right now.'); return; }
      const fin0=ts=>{ if(NETX('act',c,ab,ts)) w.res('acted'); else toast('Not enough mana.'); };
      const fin=ts=>{ if(ab.discard||ab.sac) collectCostRefs(c,ab).then(refs=>{ if(refs) fin0(ts.concat(refs)); }); else fin0(ts); };
      if(ab.target&&ab.target2) startTargeting(ab.target,c,`Choose ${ab.target.label} for ${c.d.name}.`,ref=>{ const sp2=ab.target2(ref,c); startTargeting(sp2,c,`Choose ${sp2.label} for ${c.d.name}.`,r2=>fin([ref,r2])); });
      else if(ab.target) startTargeting(ab.target,c,`Choose ${ab.target.label} for ${c.d.name}.`,ref=>fin([ref])); else fin([]); };
    const usable=lab.filter(ab=>abilityUsable(0,c,ab));
    if(lab.length&&!pr){ if(usable.length===1) useAb(usable[0]); else if(usable.length>1) askChoice(c.d.name,'Use which ability?',usable.map((ab,i)=>[String(i),ab.label||'Use ability'])).then(v=>useAb(usable[+v])); else toast('You cannot use that ability right now.'); return; }
    if(usable.length){ askChoice(c.d.name,'Tap for mana or use an ability?',[['m','Tap for mana'],...usable.map((ab,i)=>['a'+i,ab.label||'Use ability'])]).then(v=>{ if(v==='m') tapMana(); else useAb(usable[+v.slice(1)]); }); return; }
    tapMana(); return; }
  const abs=c.d.abilities||[];
  const manaAb=abs.find(a=>a.mana);
  if(manaAb&&manaAb.battery){
    const other=abs.find(a=>!a.mana&&abilityUsable(0,c,a));
    const doTap=()=>{ const mx=c.counters||0; if(!mx){ NETX('tapc',c,manaAb.mana); render(); return; }
      askChoice(c.d.name,`How many counters do you wish to spend for additional mana? (max: ${mx})`,Array.from({length:mx+1},(_,i)=>[String(i),String(i)])).then(v=>{ NETX('tapc',c,manaAb.mana.repeat(1+(+v))); render(); }); };
    if(other) askChoice(c.d.name,'What do you want to do?',[['m','Tap for mana'],['a',other.label||'Charge']]).then(v=>{ if(v==='m') doTap(); else { const fin=ts=>{ if(NETX('act',c,other,ts)) w.res('acted'); else toast('Not enough mana.'); }; fin([]); } }); else doTap();
    return;
  }
  if(manaAb){
    if(isCreature(c)&&c.sick){ toast(`${c.d.name} has summoning sickness.`); return; }
    if(manaAb.mana==='*') chooseColor(k=>{ NETX('tapc',c,k); render(); });
    else { NETX('tapc',c,manaAb.mana); render(); }
    return;
  }
  const ab=abs.find(a=>abOK(c,a,0)); if(!ab) return;
  if(!abilityUsable(0,c,ab)){ toast(ab.tap&&isCreature(c)&&c.sick?`${c.d.name} has summoning sickness.`:'You cannot use that ability right now.'); return; }
  const run=xv=>{ if(ab.manaNow==='*'){ chooseColor(k=>{ if(NETX('act',c,ab,[{kind:'color',c:k}],0)) w.res('acted'); }); return; }
    const fin0=ts=>{ if(NETX('act',c,ab,ts,xv)) w.res('acted'); else toast('Not enough mana.'); };
    const fin=ts=>{ if(ab.discard||ab.sac) collectCostRefs(c,ab).then(refs=>{ if(refs) fin0(ts.concat(refs)); }); else fin0(ts); };
    if(ab.target&&ab.target2) startTargeting(ab.target,c,`Choose ${ab.target.label} for ${c.d.name}.`,ref=>{ const sp2=ab.target2(ref,c); startTargeting(sp2,c,`Choose ${sp2.label} for ${c.d.name}.`,r2=>fin([ref,r2])); });
    else if(ab.target&&!ab.rollTarget) startTargeting(ab.target,c,`Choose ${ab.target.label} for ${c.d.name}.`,ref=>fin([ref]));
    else fin([]); };
  if(ab.x){ const mx=maxX(0,abCost(c,ab)); if(mx<1){ toast('Not enough mana for X ≥ 1.'); return; } chooseX(c,mx,run); } else run(0);
}
function onCardClick(c){
  ui.preview=c;
  if(ui.targeting){ if(!finishTarget({kind:'card',iid:c.iid})) render(); return; }
  const w=ui.wait; if(!w){ render(); return; }
  if(w.kind==='attack'){
    if(ui.attackable.has(c.iid)){ if(c.d.mustAttack||c.forceAtk===g.turn) toast(c.d.name+' must attack.'); else if(ui.attack.has(c.iid)) ui.attack.delete(c.iid); else if(g.bf.some(k=>k.d.id==='caverns_of_despair')&&ui.attack.size>=2) toast('Caverns of Despair: no more than two creatures can attack.'); else ui.attack.add(c.iid); }
    render(); return;
  }
  if(w.kind==='block'){
    if(ctrl(c)===0&&isCreature(c)){
      if(ui.blocks.has(c.iid)){ ui.blocks.delete(c.iid); ui.blockSel=null; }
      else if(c.tapped) toast('Tapped creatures cannot block.');
      else ui.blockSel=ui.blockSel===c.iid?null:c.iid;
    } else if(c.attacking&&ui.blockSel){
      const b=byIid(ui.blockSel);
      if(g.bf.some(k=>k.d.id==='caverns_of_despair')&&!ui.blocks.has(b.iid)&&ui.blocks.size>=2){ toast('Caverns of Despair: no more than two creatures can block.'); ui.blockSel=null; }
      else if(canBlock(b,c)){ ui.blocks.set(b.iid,c.iid); ui.blockSel=null; }
      else toast(`${b.d.name} cannot block ${c.d.name}.`);
    }
    render(); return;
  }
  if(w.kind==='priority'&&(ctrl(c)===0||(c.d.abilities||[]).some(a=>abOK(c,a,0)))){ humanUsePermanent(c); return; }
  render();
}
function onLandClick(id,owner){
  const cs=g.bf.filter(c=>c.d.id===id&&ctrl(c)===owner);
  if(!cs.length) return;
  ui.preview=cs[0];
  if(ui.targeting){ const c=cs.filter(c=>!c.tapped).find(c=>legal(ui.targeting.spec,targetRefFor(c),ui.targeting.src))||cs.find(c=>legal(ui.targeting.spec,targetRefFor(c),ui.targeting.src)); if(c) finishTarget(targetRefFor(c)); else render(); return; }
  if(owner===0&&ui.wait&&ui.wait.kind==='priority'){ const c=cs.find(c=>!c.tapped); if(c) humanUsePermanent(c); else toast('All of those lands are tapped.'); return; }
  render();
}
function onHandClick(c){
  ui.preview=c;
  const w=ui.wait;
  if(ui.targeting){ render(); return; }
  if(w&&w.kind==='discard'){ NETX('disc',c); if(w.data.exact){ w.data.n--; if(w.data.n<=0||!g.players[0].hand.length) w.res('done'); else render(); return; } if(g.players[0].hand.length<=7) w.res('done'); else { w.data.n=g.players[0].hand.length-7; render(); } return; }
  humanCast(c);
}
function zoneModal(pid,zone){
  const P=g.players[pid], cs=P[zone];
  openModal(`<h2>${esc(P.name)} — ${zone==='graveyard'?'Graveyard':'Removed from the game'}</h2>
    <div class="mgrid">${cs.length?cs.map(c=>cardFace(c.d,'','hc','')).join(''):'<span class="muted">Empty.</span>'}</div>
    <button class="btn ghost" data-close>Close</button>`);
}
function showGameOver(){
  if(HEADLESS) return;
  if(NET.role&&NET.ch){ netGameOver(); return; }
  if(ui.advDuel){ advDuelEnd(); return; }
  const w=g.over.winner; sfx(w===0?'win':'lose');
  openModal(`<h2>${w===0?'Victory':w===1?'Defeat':'A draw'}</h2>
    <p>${w===0?`You defeated ${esc(playerName(1))} on turn ${g.turn}.`:w===1?`${esc(playerName(1))} won on turn ${g.turn}.`:'Both players fell at once.'}</p>${g.antePlay?(()=>{ const r=anteResult(); return (r.gained.length?`<p>Ante won: ${r.gained.map(i=>esc(DB[i].name)).join(', ')}</p>`:'')+(r.lost.length?`<p>Ante lost: ${r.lost.map(i=>esc(DB[i].name)).join(', ')}</p>`:''); })():''}
    <div class="hrow"><button class="btn" data-act="rematch">Rematch</button><button class="btn ghost" data-act="toDeck">Back to deck builder</button><button class="btn ghost" data-close>View board</button></div>`);
}
